      </tr></thead><tbody>
      ${pageRows.map(r => `<tr class="clickable" onclick="openLedgerFor('customer','${esc(r.khachHang).replace(/'/g,"\\'")}')">
        <td>${esc(r.khachHang)}</td>
        <td class="num">${fmtKl(r.klNhapTrongKy)}</td><td class="num">${fmtMoney(r.giaTriNhapTrongKy)}</td><td class="num">${fmtMoney(r.daTTTrongKy)}</td>
        <td class="num">${fmtMoney(r.giaTriNhapLuyKe)}</td><td class="num">${fmtMoney(r.daTTLuyKe)}</td>
        <td class="num ${r.congNo>0?'debt-neg':'debt-pos'}">${fmtMoney(r.congNo)}</td>
      </tr>`).join('')}
      </tbody></table>
      ${renderPager(rows.length, state.debtCustomerPage, 'goDebtCustomerPage')}
    </div>`;
}
function goDebtCustomerPage(p){ state.debtCustomerPage = p; renderDebtByCustomerTable(); }

/* ---------- Tab 2: Công nợ theo Hợp đồng ---------- */
function loadDebtByContract(){
  const body = document.getElementById('debt-body');
  body.innerHTML = '<div class="card"><div class="empty"><div class="ic">⏳</div>Đang tải...</div></div>';
  call('getDebtByContract', [state.debtFrom, state.debtTo], 'Đang tính công nợ theo hợp đồng...').then(rows => {
    state.debtContractRows = rows;
    if (!rows.length) { body.innerHTML = '<div class="card"><div class="empty"><div class="ic">📭</div>Chưa có hợp đồng nào phát sinh.</div></div>'; return; }
    renderDebtByContractTable();
  });
}
function renderDebtByContractTable(){
  const body = document.getElementById('debt-body');
  const rows = state.debtContractRows;
  const totalPages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
  if (state.debtContractPage > totalPages) state.debtContractPage = totalPages;
  const pageRows = pageSlice(rows, state.debtContractPage);
  const tongDangCho = rows.reduce((s,r)=>s+r.giaTriDangCho,0);
  body.innerHTML = `
    <div class="grid cols-3">
      <div class="stat"><div class="label">Số hợp đồng có phát sinh</div><div class="value">${rows.length}</div></div>
      <div class="stat"><div class="label">Tổng đang chờ thanh toán (Nháp)</div><div class="value ${tongDangCho>0?'debt-neg':'debt-pos'}">${fmtMoney(tongDangCho)}</div></div>
      <div class="stat"><div class="label">Giá trị TT trong kỳ đã chọn</div><div class="value">${fmtMoney(rows.reduce((s,r)=>s+r.giaTriTrongKy,0))}</div></div>
    </div>
    <div class="hint-text" style="margin:10px 0">Lưu ý: chỉ tính phiếu cân ĐÃ được gán vào hợp đồng (qua Tách Phiếu/Thêm Mới). Xem thêm tab "Theo Khách Hàng" để có bức tranh đầy đủ (kể cả phiếu cân chưa gán hợp đồng).</div>
    <div class="card">
      <h3>Công nợ theo Hợp đồng — bấm 1 dòng để xem Sổ chi tiết</h3>
      <table><thead><tr>
        <th>Số HĐ</th><th>Chủ rừng</th><th>Ngày ký</th><th class="num">SL dự kiến (tấn)</th><th class="num">SL đã thực hiện</th>
        <th class="num">Còn lại/Vượt SL</th><th class="num">Giá trị TT trong kỳ</th><th class="num">Đang chờ TT (công nợ)</th>
      </tr></thead><tbody>
      ${pageRows.map(r => `<tr class="clickable" onclick="openLedgerFor('contract','${esc(r.soHD).replace(/'/g,"\\'")}')">
        <td class="mono">${esc(r.soHD)}</td><td>${esc(r.chuRung)}</td><td>${esc(r.ngayKy)}</td>
        <td class="num">${fmtKl(r.slDuKien)}</td><td class="num">${fmtKl(r.klThucHienLuyKe)}</td>
        <td class="num ${r.conLaiSanLuong<0?'debt-neg':''}">${fmtKl(Math.abs(r.conLaiSanLuong))}${r.conLaiSanLuong<0?' (vượt)':''}</td>
        <td class="num">${fmtMoney(r.giaTriTrongKy)}</td>
        <td class="num ${r.congNo>0?'debt-neg':'debt-pos'}">${fmtMoney(r.congNo)}</td>
      </tr>`).join('')}
      </tbody></table>
      ${renderPager(rows.length, state.debtContractPage, 'goDebtContractPage')}
    </div>`;
}
function goDebtContractPage(p){ state.debtContractPage = p; renderDebtByContractTable(); }

/* ---------- Tab 4: Sổ chi tiết công nợ ---------- */
function openLedgerFor(type, key){
  state.debtTab = 'ledger';
  state.debtLedgerType = type;
  state.debtLedgerKey = key;
  renderDebt();
}

function renderDebtLedgerTab(){
  const body = document.getElementById('debt-body');
  const type = state.debtLedgerType || 'customer';
  const key = state.debtLedgerKey || '';

  const custOptions = (state.debtCustomerRows || []).map(r => r.khachHang);
  const hdOptions = (state.debtContractRows || []).map(r => r.soHD);

  body.innerHTML = `
    <div class="card">
      <div class="grid cols-3">
        <div class="field"><label>Loại sổ</label>
          <select id="ledger-type">
            <option value="customer" ${type==='customer'?'selected':''}>Theo Khách hàng (Nợ/Có/Số dư)</option>
            <option value="contract" ${type==='contract'?'selected':''}>Theo Hợp đồng (tiến độ)</option>
          </select>
        </div>
        <div class="field"><label>Đối tượng</label>
          <select id="ledger-key">
            <option value="">-- Chọn --</option>
            ${(type==='customer'?custOptions:hdOptions).map(v=>`<option value="${esc(v)}" ${v===key?'selected':''}>${esc(v)}</option>`).join('')}
          </select>
        </div>
        <div class="field" style="display:flex; align-items:flex-end"><button class="btn primary" onclick="loadLedgerDetail()">🔍 Xem sổ chi tiết</button></div>
      </div>
      <div class="hint-text">Danh sách đối tượng lấy từ dữ liệu đã xem ở tab "Theo Khách Hàng" / "Theo Hợp Đồng" - nếu trống, hãy mở tab đó trước.</div>
    </div>
    <div id="ledger-result"></div>`;

  document.getElementById('ledger-type').addEventListener('change', e => {
    state.debtLedgerType = e.target.value;
    state.debtLedgerKey = '';
    renderDebtLedgerTab();
  });

  if (type && key) loadLedgerDetail();
}

function loadLedgerDetail(){
  const type = document.getElementById('ledger-type').value;
  const key = document.getElementById('ledger-key').value;
  state.debtLedgerType = type; state.debtLedgerKey = key;
  if (!key) { toast('Vui lòng chọn đối tượng cần xem.', 'warn'); return; }

  const box = document.getElementById('ledger-result');
  box.innerHTML = '<div class="card"><div class="empty"><div class="ic">⏳</div>Đang tải...</div></div>';
  state.ledgerPage = 1;
  call('getDebtLedgerDetail', [type, key, state.debtTo], 'Đang tải sổ chi tiết...').then(res => {
    if (!res.success) { box.innerHTML = `<div class="card"><div class="empty"><div class="ic">⚠️</div>${esc(res.message)}</div></div>`; return; }
    state.ledgerData = res;
    renderLedgerDetailTable();
  });
}

function renderLedgerDetailTable(){
  const box = document.getElementById('ledger-result');
  const res = state.ledgerData;
  const rows = res.rows || [];
  const totalPages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
  if (state.ledgerPage > totalPages) state.ledgerPage = totalPages;
  const pageRows = pageSlice(rows, state.ledgerPage);

  if (res.mode === 'customer') {
    box.innerHTML = `
      <div class="grid cols-3">
        <div class="stat"><div class="label">Tổng phát sinh Nợ (nhập)</div><div class="value">${fmtMoney(res.tongNo)}</div></div>
        <div class="stat"><div class="label">Tổng phát sinh Có (đã trả)</div><div class="value">${fmtMoney(res.tongCo)}</div></div>
        <div class="stat"><div class="label">Số dư cuối kỳ (còn nợ)</div><div class="value ${res.duCuoiKy>0?'debt-neg':'debt-pos'}">${fmtMoney(res.duCuoiKy)}</div></div>
      </div>
      <div class="card" style="margin-top:16px">
        <h3>Sổ chi tiết công nợ - ${esc(res.key)}</h3>
        <table><thead><tr><th>Ngày</th><th>Diễn giải</th><th class="num">Phát sinh Nợ</th><th class="num">Phát sinh Có</th><th class="num">Số dư</th></tr></thead><tbody>
          ${pageRows.map(r => `<tr><td>${esc(r.ngay)}</td><td>${esc(r.dienGiai)}</td>
            <td class="num">${r.no?fmtMoney(r.no):''}</td><td class="num">${r.co?fmtMoney(r.co):''}</td>
            <td class="num ${r.du>0?'debt-neg':'debt-pos'}">${fmtMoney(r.du)}</td></tr>`).join('')}
        </tbody></table>
        ${renderPager(rows.length, state.ledgerPage, 'goLedgerPage')}
      </div>`;
  } else {
    box.innerHTML = `
      <div class="grid cols-3">
        <div class="stat"><div class="label">Đã thanh toán</div><div class="value">${fmtMoney(res.tongDaTT)}</div></div>
        <div class="stat"><div class="label">Đang chờ (Nháp)</div><div class="value ${res.tongDangCho>0?'debt-neg':'debt-pos'}">${fmtMoney(res.tongDangCho)}</div></div>
        <div class="stat"><div class="label">Công nợ hiện tại</div><div class="value ${res.congNo>0?'debt-neg':'debt-pos'}">${fmtMoney(res.congNo)}</div></div>
      </div>
      <div class="card" style="margin-top:16px">
        <h3>Tiến độ hợp đồng - ${esc(res.key)}</h3>
        <table><thead><tr><th>Ngày</th><th>Số phiếu cân</th><th class="num">KL (tấn)</th><th class="num">Thành tiền</th><th>Trạng thái</th></tr></thead><tbody>
          ${pageRows.map(r => `<tr><td>${esc(r.ngay)}</td><td class="mono">${esc(r.soPhieuCan)}</td>
            <td class="num">${fmtKl(r.klTan)}</td><td class="num">${fmtMoney(r.thanhTien)}</td>
            <td><span class="badge ${r.trangThai==='Đã thanh toán'?'ready':'pending'} dot">${esc(r.trangThai)}</span></td></tr>`).join('')}
        </tbody></table>
        ${renderPager(rows.length, state.ledgerPage, 'goLedgerPage')}
      </div>`;
  }
}
function goLedgerPage(p){ state.ledgerPage = p; renderLedgerDetailTable(); }

/* ---------- Tab 5: Phân tích tình hình thanh toán ---------- */
function loadPaymentAnalysis(){
  const body = document.getElementById('debt-body');
  body.innerHTML = '<div class="card"><div class="empty"><div class="ic">⏳</div>Đang tải...</div></div>';
  call('getPaymentAnalysis', [state.debtFrom, state.debtTo], 'Đang phân tích...').then(a => {
    body.innerHTML = `
      <div class="grid cols-4">
        <div class="stat"><div class="label">Tổng KL gỗ keo nhập</div><div class="value">${fmtKl(a.tongKLNhap)}</div><div class="hint">tấn</div></div>
        <div class="stat"><div class="label">Tổng giá trị nhập</div><div class="value">${fmtMoney(a.tongGiaTriNhap)}</div></div>
        <div class="stat"><div class="label">Tổng giá trị đã TT</div><div class="value timber">${fmtMoney(a.tongGiaTriDaTT)}</div></div>
        <div class="stat"><div class="label">Số HĐ được thanh toán</div><div class="value">${a.soLuongHopDongDuocTT}</div></div>
      </div>
      <div class="grid cols-2" style="margin-top:16px">
        <div class="card">
          <h3>Theo Nguồn gốc</h3>
          <table><thead><tr><th>Nguồn gốc</th><th class="num">KL (tấn)</th><th class="num">Giá trị</th></tr></thead><tbody>
            ${a.theoNguonGoc.map(r => `<tr><td>${esc(r.nhan)}</td><td class="num">${fmtKl(r.klTan)}</td><td class="num">${fmtMoney(r.giaTri)}</td></tr>`).join('') || '<tr><td colspan="3" class="muted" style="text-align:center;padding:16px">Không có dữ liệu</td></tr>'}
          </tbody></table>
        </div>
        <div class="card">
          <h3>Theo Đại lý</h3>
          <table><thead><tr><th>Đại lý</th><th class="num">KL (tấn)</th><th class="num">Giá trị</th></tr></thead><tbody>
            ${a.theoDaiLy.map(r => `<tr><td>${esc(r.nhan)}</td><td class="num">${fmtKl(r.klTan)}</td><td class="num">${fmtMoney(r.giaTri)}</td></tr>`).join('') || '<tr><td colspan="3" class="muted" style="text-align:center;padding:16px">Không có dữ liệu</td></tr>'}
          </tbody></table>
        </div>
      </div>`;
  });
}

/* ============================================================
 * CÀI ĐẶT / FILE NHÁP
 * ============================================================ */
function renderSettings(){
  document.getElementById('topbar-actions').innerHTML = '';
  const c = document.getElementById('content');
  c.innerHTML = `<div class="card"><div class="empty"><div class="ic">⏳</div>Đang kiểm tra...</div></div>`;
  call('getDashboardStats', [], null).then(s => {
    const c2 = document.getElementById('content');
    if (s.draftSetup) {
      c2.innerHTML = `<div class="card">
        <h3>✅ File Nháp đã sẵn sàng</h3>
        <p class="muted" style="font-size:13px">Các nút "Tạo Đề Nghị Thanh Toán", "Đề Nghị Thanh Toán" và "Đóng Thanh Toán" đang hoạt động bình thường.</p>
        <button class="btn primary" onclick="openDraftFileLink()">📂 Mở File Nháp</button>
      </div>
      <div class="card" id="config-links-card"><div class="empty"><div class="ic">⏳</div>Đang tải danh sách link...</div></div>
      <div class="card">
        <h3>Tốc độ tải dữ liệu</h3>
        <p class="muted" style="font-size:13px">Hệ thống chỉ tải các Phiếu cân CHƯA thanh toán vào 1 bản sao thu gọn (cache) để chọn nhanh hơn khi tạo đề nghị thanh toán. Bấm nút bên dưới nếu vừa nhập phiếu cân mới mà chưa thấy xuất hiện để chọn.</p>
        <button class="btn" onclick="doRefreshPcCache()">🔄 Làm Mới Cache Phiếu Cân (chưa TT)</button>
      </div>
      <div class="card">
        <h3>Tiện ích khác</h3>
        <button class="btn" onclick="runFillBank()">🏦 Vá Ngân Hàng Còn Trống (dữ liệu chính thức)</button>
      </div>`;
      loadConfigLinks();
    } else {
      c2.innerHTML = `<div class="card" style="border-color:var(--timber); background:var(--timber-light)">
        <h3 style="color:#8C511F">⚙️ Chưa thiết lập File Nháp</h3>
        <p style="font-size:13px">File Nháp là 1 Google Sheet riêng biệt dùng để chứa hồ sơ đang xử lý trước khi chốt thanh toán chính thức. Bấm nút bên dưới để tạo (chỉ cần làm 1 lần).</p>
        <button class="btn accent" onclick="doSetupDraft()">⚙️ Khởi Tạo File Nháp</button>
      </div>`;
    }
  });
}

function loadConfigLinks(){
  call('getConfigLinksForSettings', [], null).then(links => {
    const box = document.getElementById('config-links-card');
    if (!box) return;
    box.innerHTML = `<h3>Link các file liên quan (mục T - dễ bảo trì)</h3>
      <p class="muted" style="font-size:13px">Toàn bộ ID/link các file Google Sheet mà hệ thống kết nối tới được gom vào 1 chỗ (<code>LINKS</code>) ở đầu Code.gs - cần đổi file khác chỉ cần sửa đúng 1 dòng ở đó.</p>
      <div style="display:flex;flex-direction:column;gap:6px;margin-top:8px">
        ${links.map(l => l.url
          ? `<a href="${esc(l.url)}" target="_blank"><button class="btn ghost" style="width:100%;text-align:left">🔗 ${esc(l.label)}</button></a>`
          : `<button class="btn ghost" style="width:100%;text-align:left;opacity:.5" disabled>🔗 ${esc(l.label)} (chưa cấu hình)</button>`
        ).join('')}
      </div>`;
  }).catch(()=>{
    const box = document.getElementById('config-links-card');
    if (box) box.innerHTML = '';
  });
}

function doSetupDraft(){
  call('setupDraftSpreadsheet', [], 'Đang tạo File Nháp...').then(res => {
    if (res.alreadySetup) { toast(res.message, 'warn'); return; }
    openModal(`<div class="modal-head"><h3>✅ Đã tạo File Nháp</h3><button class="x" onclick="closeModal()">&times;</button></div>
      <div class="modal-body">
        <p style="font-size:13px">Copy ID bên dưới, dán vào <code>CFG.DRAFT_SS_ID</code> trong Apps Script Editor rồi lưu lại trước khi dùng.</p>
        <div class="kv"><span class="k">ID</span><span class="v mono">${esc(res.id)}</span></div>
        <a href="${res.url}" target="_blank"><button class="btn primary" style="margin-top:10px">Mở File Nháp</button></a>
      </div>
      <div class="modal-foot"><button class="btn ghost" onclick="closeModal()">Đóng</button></div>`);
  });
}
function openDraftFileLink(){
  call('setupDraftSpreadsheet', [], null).then(res => { if (res.url) window.open(res.url, '_blank'); });
}
function runFillBank(){
  call('runFillMissingBankOnly', [], 'Đang vá dữ liệu Ngân hàng...').then(res => handleResult(res));
}
function doRefreshPcCache(){
  call('webRefreshPhieuCanCache', [], 'Đang làm mới cache Phiếu Cân...').then(res => handleResult(res));
}

/* ============================================================
 * INIT
 * ============================================================ */
goTo('dashboard');
</script>
</body>
</html>
