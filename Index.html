  const c = document.getElementById('content');
  c.innerHTML = `<div class="card"><div class="empty"><div class="ic">⏳</div>Đang kiểm tra...</div></div>`;
  call('getDashboardStats', [], null).then(s => {
    const c2 = document.getElementById('content');
    if (s.draftSetup) {
      c2.innerHTML = `<div class="card">
        <h3>✅ File Nháp đã sẵn sàng</h3>
        <p class="muted" style="font-size:13px">Các nút "Tạo Đề Nghị Thanh Toán", "Đề Nghị Thanh Toán" và "Đóng Thanh Toán" đang hoạt động bình thường.</p>
        <button class="btn primary" onclick="openDraftFileLink()">📂 Mở File Nháp</button>
      </div>
      <div class="card" id="config-links-card"><div class="empty"><div class="ic">⏳</div>Đang tải danh sách link...</div></div>
      <div class="card">
        <h3>Tốc độ tải dữ liệu</h3>
        <p class="muted" style="font-size:13px">Hệ thống mirror Phiếu cân CHƯA thanh toán, HD_NCC, HD_STK ("Đang Thực Hiện"), Tiến Độ Hợp Đồng và snapshot Công Nợ (3 tháng gần nhất) vào File Nháp. Tự động làm mới lúc <b>7:30 sáng và 13:00 chiều</b> hàng ngày nếu đã bật Trigger (menu Sheet). Bấm nút bên dưới nếu vừa nhập phiếu cân/hợp đồng mới mà chưa thấy xuất hiện để chọn.</p>
        <button class="btn" onclick="doRefreshPcCache()">🔄 Làm Mới Toàn Bộ (Phiếu Cân, HD_NCC, HD_STK, Tiến Độ HĐ)</button>
        <button class="btn" style="margin-top:8px" onclick="doSetup10MinTrigger()">⏱️ Bật Tự Động 10 Phút (Phiếu Cân, Hợp Đồng, 7:30-19:00)</button>
        <button class="btn" style="margin-top:8px" onclick="doSetupDaily15hTrigger()">⏱️ Bật Tự Động 15h (Phân Tích NG-ĐL + Chi Tiết Công Nợ PC)</button>
        <button class="btn" style="margin-top:8px" onclick="doResetPhanTich()">🧹 Xóa Sạch &amp; Nạp Lại Phân Tích NG-ĐL</button>
        <button class="btn" style="margin-top:8px" onclick="doResetChiTietCongNo()">🧹 Xóa Sạch &amp; Nạp Lại Chi Tiết Công Nợ PC</button>
      </div>
      <div class="card">
        <h3>Tiện ích khác</h3>
        <button class="btn" onclick="runFillBank()">🏦 Vá Ngân Hàng Còn Trống (dữ liệu chính thức)</button>
        <button class="btn" style="margin-top:8px" onclick="doGenerateThongSo()">📋 Tạo/Cập Nhật Sheet Thông Số</button>
      </div>`;
      loadConfigLinks();
    } else {
      c2.innerHTML = `<div class="card" style="border-color:var(--timber); background:var(--timber-light)">
        <h3 style="color:#8C511F">⚙️ Chưa thiết lập File Nháp</h3>
        <p style="font-size:13px">File Nháp là 1 Google Sheet riêng biệt dùng để chứa hồ sơ đang xử lý trước khi chốt thanh toán chính thức. Bấm nút bên dưới để tạo (chỉ cần làm 1 lần).</p>
        <button class="btn accent" onclick="doSetupDraft()">⚙️ Khởi Tạo File Nháp</button>
      </div>`;
    }
  });
}

function loadConfigLinks(){
  call('getConfigLinksForSettings', [], null).then(links => {
    const box = document.getElementById('config-links-card');
    if (!box) return;
    box.innerHTML = `<h3>Link các file liên quan (mục T - dễ bảo trì)</h3>
      <p class="muted" style="font-size:13px">Toàn bộ ID/link các file Google Sheet mà hệ thống kết nối tới được gom vào 1 chỗ (<code>LINKS</code>) ở đầu Code.gs - cần đổi file khác chỉ cần sửa đúng 1 dòng ở đó.</p>
      <div style="display:flex;flex-direction:column;gap:6px;margin-top:8px">
        ${links.map(l => l.url
          ? `<a href="${esc(l.url)}" target="_blank"><button class="btn ghost" style="width:100%;text-align:left">🔗 ${esc(l.label)}</button></a>`
          : `<button class="btn ghost" style="width:100%;text-align:left;opacity:.5" disabled>🔗 ${esc(l.label)} (chưa cấu hình)</button>`
        ).join('')}
      </div>`;
  }).catch(()=>{
    const box = document.getElementById('config-links-card');
    if (box) box.innerHTML = '';
  });
}

function doSetupDraft(){
  call('setupDraftSpreadsheet', [], 'Đang tạo File Nháp...').then(res => {
    if (res.alreadySetup) { toast(res.message, 'warn'); return; }
    openModal(`<div class="modal-head"><h3>✅ Đã tạo File Nháp</h3><button class="x" onclick="closeModal()">&times;</button></div>
      <div class="modal-body">
        <p style="font-size:13px">Copy ID bên dưới, dán vào <code>CFG.DRAFT_SS_ID</code> trong Apps Script Editor rồi lưu lại trước khi dùng.</p>
        <div class="kv"><span class="k">ID</span><span class="v mono">${esc(res.id)}</span></div>
        <a href="${res.url}" target="_blank"><button class="btn primary" style="margin-top:10px">Mở File Nháp</button></a>
      </div>
      <div class="modal-foot"><button class="btn ghost" onclick="closeModal()">Đóng</button></div>`);
  });
}
function openDraftFileLink(){
  call('setupDraftSpreadsheet', [], null).then(res => { if (res.url) window.open(res.url, '_blank'); });
}
function runFillBank(){
  call('runFillMissingBankOnly', [], 'Đang vá dữ liệu Ngân hàng...').then(res => handleResult(res));
}
function doRefreshPcCache(){
  call('webRefreshPhieuCanCache', [], 'Đang làm mới cache Phiếu Cân...').then(res => handleResult(res));
}
function doSetup10MinTrigger(){
  call('setup10MinRefreshTrigger', [], 'Đang bật tự động 10 phút...').then(res => handleResult(res));
}
function doSetupDaily15hTrigger(){
  call('setupDaily15hTrigger', [], 'Đang bật tự động 15h...').then(res => handleResult(res));
}
function doResetPhanTich(){
  if (!confirm('Xóa sạch toàn bộ dữ liệu Phân Tích Nhập/TT hiện có (kể cả dữ liệu đúng) để nạp lại từ đầu? Dữ liệu sẽ tự tính lại dần, không mất số liệu gốc (Phiếu Cân/CT thật vẫn còn nguyên).')) return;
  call('webResetPhanTichNhapTTSheet', [], 'Đang xóa sạch và chuẩn bị nạp lại...').then(res => handleResult(res));
}
function doResetChiTietCongNo(){
  if (!confirm('Xóa sạch toàn bộ dữ liệu Chi Tiết Công Nợ theo Phiếu Cân hiện có để nạp lại từ đầu? Không mất số liệu gốc (Phiếu Cân vẫn còn nguyên).')) return;
  call('webResetChiTietCongNoSheet', [], 'Đang xóa sạch và chuẩn bị nạp lại...').then(res => handleResult(res));
}
function doGenerateThongSo(){
  call('generateThongSoSheet', [], 'Đang tạo/cập nhật Sheet Thông Số...').then(res => handleResult(res));
}

/* ============================================================
 * INIT
 * ============================================================ */
goTo('dashboard');
</script>
</body>
</html>
