<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quản Lý Thanh Toán HAK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --paper:#FAF7F1;
      --paper-2:#F1ECE2;
      --ink:#232A20;
      --ink-soft:#5B6355;
      --line:#E1D9C8;
      --forest:#1F3327;
      --forest-2:#2C4636;
      --moss:#3D6B4F;
      --moss-light:#DCE9DF;
      --timber:#B5702F;
      --timber-light:#F3E3CD;
      --danger:#B3432B;
      --danger-light:#F5DFD6;
      --white:#FFFFFF;
      --radius:10px;
      --shadow:0 1px 2px rgba(35,42,32,.06), 0 4px 14px rgba(35,42,32,.05);
    }
    *{box-sizing:border-box;}
    html,body{margin:0;padding:0;height:100%;}
    body{
      font-family:'Inter',sans-serif;
      background:var(--paper);
      color:var(--ink);
      display:flex;
      min-height:100vh;
    }
    ::selection{background:var(--moss-light);}
    h1,h2,h3,.serif{font-family:'Source Serif 4',serif;}
    .mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;}
    a{color:inherit;}
    button{font-family:inherit;}

    /* ---------- SIDEBAR ---------- */
    .sidebar{
      width:236px;
      flex:0 0 236px;
      background:var(--forest);
      color:#EFE9DC;
      display:flex;
      flex-direction:column;
      padding:22px 14px;
      position:sticky;
      top:0;
      height:100vh;
    }
    .brand{
      display:flex; align-items:center; gap:10px;
      padding:4px 10px 20px 10px;
      border-bottom:1px solid rgba(239,233,220,.14);
      margin-bottom:14px;
    }
    .brand .mark{
      width:34px;height:34px;border-radius:8px;
      background:linear-gradient(155deg,var(--timber),#8C511F);
      display:flex;align-items:center;justify-content:center;
      font-family:'Source Serif 4',serif;font-weight:700;color:#fff;font-size:16px;
      flex:0 0 auto;
    }
    .brand .name{font-family:'Source Serif 4',serif;font-size:15.5px;font-weight:600;line-height:1.25;}
    .brand .sub{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:#B9C2AF;margin-top:1px;}

    nav{display:flex;flex-direction:column;gap:2px;flex:1;}
    .nav-item{
      display:flex; align-items:center; gap:11px;
      padding:10px 12px;
      border-radius:8px;
      cursor:pointer;
      font-size:13.5px;
      font-weight:500;
      color:#D7DCCC;
      transition:background .15s ease, color .15s ease;
      user-select:none;
    }
    .nav-item .ic{width:18px;text-align:center;font-size:15px;opacity:.9;}
    .nav-item:hover{background:rgba(239,233,220,.08); color:#fff;}
    .nav-item.active{background:var(--forest-2); color:#fff;}
    .nav-item.active .ic{opacity:1;}
    .nav-badge{
      margin-left:auto;
      background:var(--timber);
      color:#fff;
      font-size:10.5px;
      font-weight:700;
      padding:1px 6px;
      border-radius:20px;
      min-width:18px;
      text-align:center;
    }
    .nav-sep{height:1px;background:rgba(239,233,220,.12);margin:10px 4px;}

    .sidebar-footer{
      font-size:10.5px;
      color:#8C9483;
      padding:10px 10px 2px 10px;
      border-top:1px solid rgba(239,233,220,.12);
      margin-top:10px;
    }

    /* ---------- MAIN ---------- */
    .main{flex:1; min-width:0; display:flex; flex-direction:column;}
    .topbar{
      display:flex; align-items:center; justify-content:space-between;
      padding:20px 34px;
      border-bottom:1px solid var(--line);
      background:var(--paper);
      position:sticky; top:0; z-index:5;
    }
    .topbar h1{font-size:21px; margin:0; font-weight:600; color:var(--forest);}
    .topbar .desc{font-size:12.5px; color:var(--ink-soft); margin-top:2px;}
    .topbar .actions{display:flex; gap:8px;}

    .content{padding:26px 34px 60px 34px; flex:1;}

    /* ---------- COMPONENTS ---------- */
    .card{
      background:var(--white);
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:20px;
      margin-bottom:18px;
    }
    .card h3{margin:0 0 14px 0; font-size:15px; font-weight:600; color:var(--forest);}
    .grid{display:grid; gap:16px;}
    .grid.cols-2{grid-template-columns:1fr 1fr;}
    .grid.cols-3{grid-template-columns:repeat(3,1fr);}
    .grid.cols-4{grid-template-columns:repeat(4,1fr);}
    @media(max-width:900px){.grid.cols-2,.grid.cols-3,.grid.cols-4{grid-template-columns:1fr 1fr;}}
    @media(max-width:640px){
      body{flex-direction:column;}
      .sidebar{width:100%; flex:0 0 auto; height:auto; position:relative; padding:14px;}
      nav{flex-direction:row; flex-wrap:wrap;}
      .nav-item{flex:0 0 auto;}
      .sidebar-footer{display:none;}
      .topbar,.content{padding-left:16px; padding-right:16px;}
      .grid.cols-2,.grid.cols-3,.grid.cols-4{grid-template-columns:1fr;}
    }

    .stat{
      background:var(--white); border:1px solid var(--line); border-radius:var(--radius);
      padding:18px; box-shadow:var(--shadow);
    }
    .stat .label{font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); font-weight:600;}
    .stat .value{font-family:'IBM Plex Mono',monospace; font-size:26px; font-weight:600; color:var(--forest); margin-top:6px;}
    .stat .value.timber{color:var(--timber);}
    .stat .hint{font-size:11.5px; color:var(--ink-soft); margin-top:4px;}

    label{display:block; font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:5px;}
    input[type=text], input[type=date], input[type=number], select, textarea{
      width:100%;
      border:1px solid var(--line);
      border-radius:7px;
      padding:9px 11px;
      font-size:13.5px;
      font-family:inherit;
      color:var(--ink);
      background:var(--paper);
      transition:border-color .15s ease, box-shadow .15s ease;
    }
    input:focus, select:focus, textarea:focus{
      outline:none; border-color:var(--moss); box-shadow:0 0 0 3px var(--moss-light); background:#fff;
    }
    .field{margin-bottom:14px;}
    .hint-text{font-size:11.5px; color:var(--ink-soft); margin-top:4px;}

    .btn{
      display:inline-flex; align-items:center; gap:7px;
      border:1px solid var(--line);
      background:var(--white);
      color:var(--ink);
      padding:9px 15px;
      border-radius:8px;
      font-size:13px;
      font-weight:600;
      cursor:pointer;
      transition:transform .04s ease, background .15s ease, border-color .15s ease;
    }
    .btn:hover{background:var(--paper-2);}
    .btn:active{transform:translateY(1px);}
    .btn.primary{background:var(--forest); border-color:var(--forest); color:#fff;}
    .btn.primary:hover{background:var(--forest-2);}
    .btn.accent{background:var(--timber); border-color:var(--timber); color:#fff;}
    .btn.accent:hover{background:#9C5F28;}
    .btn.danger{background:var(--white); border-color:var(--danger); color:var(--danger);}
    .btn.danger:hover{background:var(--danger-light);}
    .btn.ghost{background:transparent; border-color:transparent;}
    .btn.ghost:hover{background:var(--paper-2);}
    .btn.sm{padding:5px 10px; font-size:12px;}
    .btn:disabled{opacity:.45; cursor:not-allowed;}

    table{width:100%; border-collapse:collapse; font-size:13px;}
    thead th{
      text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em;
      color:var(--ink-soft); font-weight:700; padding:9px 10px; border-bottom:1px solid var(--line);
      white-space:nowrap;
    }
    tbody td{padding:11px 10px; border-bottom:1px solid var(--paper-2); vertical-align:middle;}
    tbody tr:hover{background:var(--paper-2);}
    tbody tr:last-child td{border-bottom:none;}
    td.num, th.num{text-align:right; font-family:'IBM Plex Mono',monospace;}

    .badge{
      display:inline-flex; align-items:center; gap:5px;
      font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px;
    }
    .badge.ready{background:var(--moss-light); color:var(--moss);}
    .badge.pending{background:var(--timber-light); color:var(--timber);}
    .badge.wait{background:#E4EAF3; color:#33517A;}
    .badge.dot::before{content:''; width:6px; height:6px; border-radius:50%; background:currentColor;}

    .empty{
      text-align:center; padding:50px 20px; color:var(--ink-soft);
    }
    .empty .ic{font-size:34px; margin-bottom:10px;}
    .empty h4{margin:0 0 5px 0; color:var(--ink); font-family:'Source Serif 4',serif; font-size:17px;}

    .chip{
      display:inline-flex; align-items:center; gap:6px;
      background:var(--paper-2); border:1px solid var(--line); border-radius:20px;
      padding:4px 10px 4px 12px; font-size:12px; margin:2px 4px 2px 0;
    }
    .chip button{background:none; border:none; cursor:pointer; color:var(--danger); font-size:14px; line-height:1; padding:0;}

    /* Stepper */
    .stepper{display:flex; gap:0; margin-bottom:22px;}
    .step{
      flex:1; text-align:center; padding:11px 6px; font-size:12.5px; font-weight:600;
      color:var(--ink-soft); border-bottom:3px solid var(--line); position:relative;
    }
    .step.active{color:var(--forest); border-color:var(--timber);}
    .step.done{color:var(--moss); border-color:var(--moss);}
    .step .n{
      display:inline-flex; align-items:center; justify-content:center;
      width:20px;height:20px;border-radius:50%;background:var(--line);color:var(--white);
      font-size:11px; margin-right:6px;
    }
    .step.active .n{background:var(--timber);}
    .step.done .n{background:var(--moss);}

    /* toast */
    #toast-wrap{position:fixed; bottom:22px; right:26px; z-index:999; display:flex; flex-direction:column; gap:8px;}
    .toast{
      background:var(--forest); color:#fff; padding:12px 16px; border-radius:9px;
      font-size:13px; box-shadow:0 8px 24px rgba(0,0,0,.18); max-width:380px;
      display:flex; gap:10px; align-items:flex-start; animation:slidein .18s ease;
    }
    .toast.err{background:#7A2A18;}
    .toast.warn{background:#8C5A1E;}
    @keyframes slidein{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}

    /* loading overlay */
    #loading-overlay{
      position:fixed; inset:0; background:rgba(250,247,241,.72); z-index:998;
      display:none; align-items:center; justify-content:center; flex-direction:column; gap:10px;
    }
    #loading-overlay.show{display:flex;}
    .spinner{
      width:34px; height:34px; border-radius:50%;
      border:3px solid var(--line); border-top-color:var(--timber);
      animation:spin .7s linear infinite;
    }
    @keyframes spin{to{transform:rotate(360deg);}}
    #loading-overlay .msg{font-size:12.5px; color:var(--ink-soft); font-weight:600;}

    /* modal */
    .modal-bg{
      position:fixed; inset:0; background:rgba(35,42,32,.45); z-index:900;
      display:none; align-items:flex-start; justify-content:center; padding:5vh 20px; overflow:auto;
    }
    .modal-bg.show{display:flex;}
    .modal{
      background:#fff; border-radius:12px; width:100%; max-width:560px;
      box-shadow:0 20px 60px rgba(0,0,0,.25); animation:pop .15s ease;
    }
    @keyframes pop{from{opacity:0; transform:translateY(8px) scale(.98);} to{opacity:1; transform:none;}}
    .modal-head{
      display:flex; align-items:center; justify-content:space-between;
      padding:16px 20px; border-bottom:1px solid var(--line);
    }
    .modal-head h3{margin:0; font-size:16px;}
    .modal-head .x{cursor:pointer; font-size:18px; color:var(--ink-soft); background:none; border:none;}
    .modal-body{padding:20px; max-height:65vh; overflow:auto;}
    .modal-foot{padding:14px 20px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:8px;}

    .kv{display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px dashed var(--line); font-size:13px;}
    .kv:last-child{border-bottom:none;}
    .kv .k{color:var(--ink-soft);}
    .kv .v{font-weight:600;}

    .checkbox-row{display:flex; align-items:center; gap:8px;}
    input[type=checkbox]{width:16px; height:16px; accent-color:var(--moss); cursor:pointer;}

    .sticky-actionbar{
      position:sticky; bottom:0; background:var(--white); border:1px solid var(--line); border-radius:var(--radius);
      box-shadow:var(--shadow); padding:14px 18px; display:flex; align-items:center; justify-content:space-between;
      margin-top:4px;
    }

    .search-row{display:flex; gap:8px; margin-bottom:12px;}

    .suggest-box{
      position:absolute; left:0; right:0; top:100%; margin-top:4px; z-index:20;
      background:var(--white); border:1px solid var(--line); border-radius:8px;
      box-shadow:var(--shadow); max-height:220px; overflow:auto;
    }
    .suggest-item{padding:9px 12px; font-size:13px; cursor:pointer;}
    .suggest-item:hover{background:var(--paper-2);}

    .subtabs{display:flex; gap:6px; margin-bottom:18px; flex-wrap:wrap;}
    .subtab{
      padding:8px 14px; border-radius:8px; font-size:12.5px; font-weight:600;
      background:var(--white); border:1px solid var(--line); color:var(--ink-soft); cursor:pointer;
    }
    .subtab:hover{background:var(--paper-2);}
    .subtab.active{background:var(--forest); border-color:var(--forest); color:#fff;}
    .debt-neg{color:var(--danger);}
    .debt-pos{color:var(--moss);}
    tr.clickable{cursor:pointer;}
    tr.clickable:hover{background:var(--timber-light) !important;}
    .search-row input{flex:1;}

    .muted{color:var(--ink-soft);}
    .hidden{display:none !important;}
  </style>
</head>
<body>

  <aside class="sidebar">
    <div class="brand">
      <div class="mark">H</div>
      <div>
        <div class="name">HAK Đà Nẵng</div>
        <div class="sub">Quản lý thanh toán</div>
      </div>
    </div>
    <nav id="nav">
      <div class="nav-item" data-page="dashboard"><span class="ic">🏠</span> Trang chủ</div>
      <div class="nav-sep"></div>
      <div class="nav-item" data-page="draft"><span class="ic">📋</span> Danh Sách ĐNTT <span class="nav-badge hidden" id="badge-draft">0</span></div>
      <div class="nav-sep"></div>
      <div class="nav-item" data-page="report"><span class="ic">📊</span> Báo Cáo Thanh Toán</div>
      <div class="nav-item" data-page="debt"><span class="ic">💰</span> Báo Cáo Công Nợ Khách Hàng Gỗ Keo</div>
      <div class="nav-sep"></div>
      <div class="nav-item" data-page="settings"><span class="ic">⚙️</span> Cài đặt / Nháp</div>
    </nav>
    <div class="sidebar-footer">Hệ thống Quản Lý Thanh Toán · v2026.5</div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <h1 id="page-title">Trang chủ</h1>
        <div class="desc" id="page-desc">Tổng quan quy trình đề nghị thanh toán</div>
      </div>
      <div class="actions" id="topbar-actions"></div>
    </div>
    <div class="content" id="content">
      <!-- render động -->
    </div>
  </main>

  <div id="loading-overlay"><div class="spinner"></div><div class="msg" id="loading-msg">Đang xử lý...</div></div>
  <div id="toast-wrap"></div>
  <div class="modal-bg" id="modal-bg"><div class="modal" id="modal"></div></div>

<script>
/* ============================================================
 * STATE & HELPERS
 * ============================================================ */
const state = {
  page: 'dashboard',
  createStep: 1,
  createData: {
    hoTenChuRung:'', cccdChuRung:'', cccdOptions:[], prefetchedForCccd:'', nguoiDeNghi:'', chuRungUyQuyen:'Không',
    soHopDong:'', soHopDongOptions:[], ngayKyHopDong:'', ngayDeNghi: new Date().toISOString().slice(0,10),
    phieuCan:[], nguoiNhanTien:'', nguoiNhanOptions:[], soTKNhanTien:'', nganHang:'', stkOptions:[]
  },
  pcSearchQuery: '',
  pcSearchResults: null,
  pcResultsPage: 1,
  draftList: [],
  draftSelected: new Set(),
  reportRows: [],
  reportSelected: new Set(),
  reportPage: 1,
  reportFilters: { chuRung:'', nguoiNhan:'', soHD:'', soLan:'' },
  debtCustomerRows: [],
  debtContractRows: [],
  debtCustomerPage: 1,
  debtContractPage: 1,
  ledgerPage: 1,
  ctcnPage: 1,
  ctcnFilters: { dl:'', ng:'', khachHang:'', ngayNhap:'' }
};

function fmtMoney(n){ return (Number(n)||0).toLocaleString('vi-VN'); }
function fmtKl(n){ return (Number(n)||0).toLocaleString('vi-VN', {minimumFractionDigits:2, maximumFractionDigits:3}); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

/* ============================================================
 * PHÂN TRANG (mục R - tối ưu tốc độ hiển thị)
 * Hiện ~20 dòng/trang cho các bảng Báo Cáo / Công Nợ - dữ liệu vẫn tải
 * về đủ 1 lần (đã giới hạn khoảng ngày ở phía server), chỉ HIỂN THỊ theo
 * trang cho đỡ nặng & dễ nhìn.
 * ============================================================ */
const PAGE_SIZE = 20;
const PC_PICKER_PAGE_SIZE = 10; // mục: danh sách chọn phiếu cân hiện 10 dòng/trang (khác PAGE_SIZE chung)
function pageSlice(rows, page, size){
  size = size || PAGE_SIZE;
  const start = (page - 1) * size;
  return rows.slice(start, start + size);
}
function renderPager(totalRows, page, onChangeFnName, size){
  size = size || PAGE_SIZE;
  const totalPages = Math.max(1, Math.ceil(totalRows / size));
  if (totalPages <= 1) return '';
  return `<div style="display:flex;align-items:center;gap:10px;justify-content:flex-end;padding:10px 2px 2px">
    <span class="muted" style="font-size:12.5px">${totalRows} dòng</span>
    <button class="btn ghost" style="padding:5px 10px" ${page<=1?'disabled':''} onclick="${onChangeFnName}(${page-1})">‹ Trước</button>
    <span class="muted mono" style="font-size:12.5px">Trang ${page}/${totalPages}</span>
    <button class="btn ghost" style="padding:5px 10px" ${page>=totalPages?'disabled':''} onclick="${onChangeFnName}(${page+1})">Sau ›</button>
  </div>`;
}
/** Giới hạn 1 cặp input[type=date] tối đa ~3 tháng - tự co "Từ ngày" lại
 * nếu người dùng chọn khoảng quá rộng, kèm cảnh báo. Trả về true nếu đã
 * tự điều chỉnh (để nơi gọi có thể thông báo thêm nếu muốn). */
const MAX_RANGE_DAYS = 95;
function clampDateRange(fromId, toId){
  const fEl = document.getElementById(fromId), tEl = document.getElementById(toId);
  if (!fEl || !tEl || !fEl.value || !tEl.value) return false;
  const f = new Date(fEl.value), t = new Date(tEl.value);
  const diffDays = Math.round((t - f) / 86400000);
  if (diffDays > MAX_RANGE_DAYS) {
    const newF = new Date(t.getTime() - MAX_RANGE_DAYS * 86400000);
    fEl.value = newF.toISOString().slice(0,10);
    toast(`⚠️ Khoảng ngày tối đa ~3 tháng để tải nhanh hơn - đã tự điều chỉnh "Từ ngày" thành ${fEl.value}.`, 'warn');
    return true;
  }
  return false;
}
function isoDaysAgo(days){
  const d = new Date();
  d.setDate(d.getDate() - days);
  return d.toISOString().slice(0,10);
}
/** MỚI (mục AB): tính ngày theo giờ GMT+7 (khớp múi giờ backend) - dùng
 * riêng cho Công Nợ để khớp đúng snapshot đã tính sẵn theo lịch
 * 7:30/13:00, tránh lệch ngày quanh nửa đêm khiến cache không khớp. */
function _vnNow_(){
  const d = new Date();
  d.setTime(d.getTime() + 7 * 3600 * 1000);
  return d;
}
function todayISOVN(){ return _vnNow_().toISOString().slice(0,10); }
function isoDaysAgoVN(days){
  const d = _vnNow_();
  d.setUTCDate(d.getUTCDate() - days);
  return d.toISOString().slice(0,10);
}

/* ============================================================
 * MỚI (mục AG - theo yêu cầu): CACHE TRÌNH DUYỆT cho "Danh sách tên
 * Chủ rừng, Hợp đồng" - dữ liệu này ít thay đổi, nên tải 1 LẦN, lưu vào
 * localStorage của trình duyệt, rồi tra cứu HOÀN TOÀN cục bộ (không gọi
 * server nữa) cho: gợi ý tên chủ rừng, danh sách CCCD, danh sách hợp
 * đồng, Người đề nghị/Ủy quyền, Người nhận tiền, Số tài khoản. Làm mới
 * lại đúng lịch 7:30 & 13:00 hàng ngày (khớp lịch cache phía server).
 * ============================================================ */
const BULK_REF_CACHE_KEY = 'hak_bulk_ref_v1';
let _bulkRefPromise = null;

/** Mốc giờ CỐ ĐỊNH gần nhất đã qua trong ngày (7:30 hoặc 13:00, theo giờ
 * máy tính người dùng) - cache tải trước mốc này coi là CŨ, phải tải lại. */
function _bulkRefBoundary_(){
  const now = new Date();
  const mk = (h, m, dayOffset) => {
    const t = new Date(now);
    t.setDate(t.getDate() + (dayOffset||0));
    t.setHours(h, m, 0, 0);
    return t.getTime();
  };
  if (now.getTime() >= mk(13,0)) return mk(13,0);
  if (now.getTime() >= mk(7,30)) return mk(7,30);
  return mk(13,0,-1); // trước 7:30 sáng -> mốc gần nhất là 13:00 hôm qua
}

/** Chuẩn hóa chuỗi giống hệt utils.standardize() phía server (uppercase +
 * xóa khoảng trắng/nháy đơn) - để tìm/lọc cục bộ cho ra kết quả khớp. */
function standardizeClient(v){
  if (v === null || v === undefined || v === '') return '';
  let s = String(v).replace(/'/g,'').replace(/\s+/g,'').toUpperCase().trim();
  if (/^-?\d+\.0+$/.test(s)) s = s.replace(/\.0+$/, '');
  return s;
}

/** Trả về Promise<{hopDong, taiKhoan}> - đọc từ localStorage nếu còn mới
 * (theo mốc 7:30/13:00), ngược lại gọi server 1 lần rồi lưu lại. */
function ensureBulkRef(forceRefresh){
  if (_bulkRefPromise && !forceRefresh) return _bulkRefPromise;
  _bulkRefPromise = new Promise(resolve => {
    if (!forceRefresh) {
      try {
        const raw = localStorage.getItem(BULK_REF_CACHE_KEY);
        if (raw) {
          const cached = JSON.parse(raw);
          if (cached && cached.fetchedAt >= _bulkRefBoundary_()) {
            resolve(cached.data);
            return;
          }
        }
      } catch(e) { /* localStorage lỗi/không khả dụng -> tải lại từ server */ }
    }
    call('getBulkReferenceData', [], null).then(data => {
      try { localStorage.setItem(BULK_REF_CACHE_KEY, JSON.stringify({ data, fetchedAt: Date.now() })); } catch(e) {}
      resolve(data);
    }).catch(() => resolve({ hopDong: [], taiKhoan: [] }));
  });
  return _bulkRefPromise;
}
/** Buộc tải lại cache trình duyệt (dùng khi bấm "Tải & Tính Lại" hoặc "↻ Làm mới"). */
function invalidateBulkRef(){
  try { localStorage.removeItem(BULK_REF_CACHE_KEY); } catch(e) {}
  _bulkRefPromise = null;
}

function showLoading(msg){
  document.getElementById('loading-msg').textContent = msg || 'Đang xử lý...';
  document.getElementById('loading-overlay').classList.add('show');
}
function hideLoading(){ document.getElementById('loading-overlay').classList.remove('show'); }

function toast(message, type){
  const wrap = document.getElementById('toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast' + (type==='err' ? ' err' : type==='warn' ? ' warn' : '');
  el.textContent = message;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(), 300); }, 4200);
}

/** Diễn giải kết quả trả về từ backend: có thể là chuỗi "✅..."/"❌..."/"⚠️...",
 * hoặc object {success, message}. */
function handleResult(res, onSuccess){
  let ok, msg;
  if (typeof res === 'string') {
    ok = res.indexOf('✅') === 0;
    msg = res;
  } else if (res && typeof res === 'object') {
    ok = !!res.success;
    msg = res.message || (ok ? 'Thành công.' : 'Có lỗi xảy ra.');
  } else {
    ok = false; msg = 'Không có phản hồi từ máy chủ.';
  }
  toast(msg, ok ? (msg.indexOf('⚠️')>=0 ? 'warn' : null) : 'err');
  if (ok && onSuccess) onSuccess(res);
  return ok;
}

/** Gọi google.script.run có Promise hóa + loading overlay. */
function call(fnName, args, loadingMsg){
  return new Promise((resolve, reject) => {
    showLoading(loadingMsg);
    google.script.run
      .withSuccessHandler(res => { hideLoading(); resolve(res); })
      .withFailureHandler(err => { hideLoading(); toast('❌ Lỗi hệ thống: ' + (err.message||err), 'err'); reject(err); })
      [fnName](...(args||[]));
  });
}

/* ---------- BƯỚC 1: Chủ rừng -> CCCD -> Người đề nghị / Ủy quyền ---------- */
let hoTenDebounce = null;

function renderCreateStep1(body){
  const d = state.createData;
  body.innerHTML = `

      <h3>Bước 1 · Chủ rừng &amp; Người đề nghị</h3>
      <div class="field" style="position:relative">

        <input type="text" id="f-hoTen" autocomplete="off" placeholder="Gõ để tìm (theo Hợp Đồng đang thực hiện)..." value="${esc(d.hoTenChuRung)}">
        <div id="hoTen-suggest" class="suggest-box hidden"></div>
        <div class="hint-text">Gợi ý theo Hợp Đồng đang thực hiện - kể cả chưa có phiếu cân dưới tên này. Khi chọn phiếu cân ở Bước 2, nếu tên Khách hàng khác Chủ rừng, hệ thống sẽ cảnh báo trước khi lưu.</div>
      </div>
      <div class="field">
        <label>Số CCCD Chủ rừng *</label>
        <select id="f-cccd" ${d.cccdOptions.length?'':'disabled'}>
          <option value="">${d.cccdOptions.length ? '-- Chọn CCCD --' : '-- Chọn Họ tên Chủ rừng trước --'}</option>
          ${d.cccdOptions.map(cc=>`<option value="${esc(cc)}" ${cc===d.cccdChuRung?'selected':''}>${esc(cc)}</option>`).join('')}
        </select>
      </div>
      <div class="grid cols-2">
        <div class="field"><label>Người đề nghị *</label><input type="text" id="f-nguoiDeNghi" value="${esc(d.nguoiDeNghi)}" placeholder="Tự điền theo Người được ủy quyền, có thể sửa"></div>
        <div class="field"><label>Chủ rừng ủy quyền?</label>
          <select id="f-uyQuyen"><option value="Không" ${d.chuRungUyQuyen==='Không'?'selected':''}>Không</option><option value="Có" ${d.chuRungUyQuyen==='Có'?'selected':''}>Có</option></select>
          <div class="hint-text">Tự điền theo hợp đồng, vẫn có thể sửa lại.</div>
        </div>
      </div>
    </div>
    <div class="sticky-actionbar">
      <span class="muted" style="font-size:12.5px">Chọn Họ tên, CCCD và nhập Người đề nghị để tiếp tục</span>
      <button class="btn primary" onclick="validateStep1AndNext()">Tiếp tục →</button>
    </div>`;

  // MỚI (mục AG): tải trước (hoặc lấy từ cache trình duyệt) danh sách
  // chủ rừng/hợp đồng ngay khi vào Bước 1 - để lúc gõ tìm không phải chờ.
  ensureBulkRef();

  const hoTenInput = document.getElementById('f-hoTen');
  hoTenInput.addEventListener('input', () => {
    d.hoTenChuRung = hoTenInput.value.trim();
    clearTimeout(hoTenDebounce);
    hoTenDebounce = setTimeout(() => searchHoTenSuggest(hoTenInput.value.trim()), 120);
  });
  hoTenInput.addEventListener('blur', () => setTimeout(() => {
    const box = document.getElementById('hoTen-suggest'); if (box) box.classList.add('hidden');
  }, 150));

  document.getElementById('f-cccd').addEventListener('change', onCccdChange);
  document.getElementById('f-nguoiDeNghi').addEventListener('input', e => d.nguoiDeNghi = e.target.value.trim());
  document.getElementById('f-uyQuyen').addEventListener('change', e => d.chuRungUyQuyen = e.target.value);
}

/** MỚI (mục AG): tìm gợi ý "Họ tên chủ rừng" HOÀN TOÀN CỤC BỘ (đọc từ
 * cache trình duyệt, không gọi server) - tức thì, không còn độ trễ
 * round-trip mỗi lần gõ phím. */
function searchHoTenSuggest(q){
  const box = document.getElementById('hoTen-suggest');
  if (!q) { if (box) box.classList.add('hidden'); return; }
  ensureBulkRef().then(ref => {
    if (!box) return;
    const qStd = standardizeClient(q);
    const seen = new Set(), list = [];
    (ref.hopDong || []).forEach(h => {
      const std = standardizeClient(h.hoTen);
      if (!std || seen.has(std) || !std.includes(qStd)) return;
      seen.add(std);
      list.push(h.hoTen);
    });
    list.sort((a,b) => a.localeCompare(b));
    const results = list.slice(0, 30);
    if (!results.length) { box.classList.add('hidden'); return; }
    box.innerHTML = results.map(n => `<div class="suggest-item" onmousedown='pickChuRung(${JSON.stringify(n)})'>${esc(n)}</div>`).join('');
    box.classList.remove('hidden');
  });
}

/** MỚI (mục AG): chọn chủ rừng - lấy danh sách CCCD cục bộ, không gọi server. */
function pickChuRung(name){
  const d = state.createData;
  d.hoTenChuRung = name;
  d.cccdChuRung = ''; d.cccdOptions = [];
  d.nguoiDeNghi = ''; d.chuRungUyQuyen = 'Không';
  d.phieuCan = []; // đổi chủ rừng -> bỏ chọn phiếu cân cũ (thuộc chủ rừng khác)
  state.pcSearchResults = null; state.pcSearchQuery = ''; state.pcResultsPage = 1; // để Bước 2 tự tải lại đúng danh sách
  const box = document.getElementById('hoTen-suggest'); if (box) box.classList.add('hidden');
  const inp = document.getElementById('f-hoTen'); if (inp) inp.value = name;
  ensureBulkRef().then(ref => {
    const nameStd = standardizeClient(name);
    const seen = new Set(), list = [];
    (ref.hopDong || []).forEach(h => {
      if (standardizeClient(h.hoTen) !== nameStd) return;
      if (!h.cccd || seen.has(h.cccd)) return;
      seen.add(h.cccd); list.push(h.cccd);
    });
    d.cccdOptions = list;
    if (list.length === 1) d.cccdChuRung = list[0];
    renderCreateStep1(document.getElementById('create-step-body'));
    if (d.cccdChuRung) onCccdChange();
  });
}

/** MỚI (mục AG): đổi CCCD - tính "Người đề nghị/Ủy quyền", danh sách Số
 * hợp đồng, danh sách Người nhận tiền HOÀN TOÀN CỤC BỘ từ cache trình
 * duyệt (KHÔNG còn gọi getChuRungContext lên server). */
function onCccdChange(){
  const d = state.createData;
  const sel = document.getElementById('f-cccd');
  if (sel) d.cccdChuRung = sel.value;
  if (!d.cccdChuRung) return;

  ensureBulkRef().then(ref => {
    const nameStd = standardizeClient(d.hoTenChuRung), cc = d.cccdChuRung;
    const hdRows = (ref.hopDong || []).filter(h => standardizeClient(h.hoTen) === nameStd && h.cccd === cc);

    let nguoiDeNghi = '', chuRungUyQuyen = 'Không';
    if (hdRows.length) {
      const newest = hdRows.slice().sort((a,b) => b.ngayKyRaw - a.ngayKyRaw)[0];
      nguoiDeNghi = newest.nguoiUQ || '';
      chuRungUyQuyen = newest.uyQuyenTT || 'Không';
    }
    const seenHD = new Set(), soHopDongOptions = [];
    hdRows.forEach(h => {
      if (!h.soHD || seenHD.has(h.soHD)) return;
      seenHD.add(h.soHD);
      soHopDongOptions.push({ soHD: h.soHD, ngayKy: h.ngayKy, slDuKien: h.slDuKien });
    });

    const seenNguoi = new Set(), nguoiNhanOptions = [];
    (ref.taiKhoan || []).forEach(t => {
      if (standardizeClient(t.hoTen) !== nameStd || t.cccd !== cc) return;
      if (!t.nguoiUQ || seenNguoi.has(t.nguoiUQ)) return;
      seenNguoi.add(t.nguoiUQ); nguoiNhanOptions.push(t.nguoiUQ);
    });

    d.nguoiDeNghi = nguoiDeNghi;
    d.chuRungUyQuyen = chuRungUyQuyen;
    d.soHopDongOptions = soHopDongOptions;
    d.nguoiNhanOptions = nguoiNhanOptions;
    d.prefetchedForCccd = d.cccdChuRung; // đánh dấu đã tải sẵn cho đúng CCCD này
    // Đổi CCCD -> làm mới các lựa chọn phụ thuộc ở Bước 2
    d.soHopDong = ''; d.ngayKyHopDong = '';
    d.nguoiNhanTien = ''; d.soTKNhanTien = ''; d.nganHang = ''; d.stkOptions = [];
    renderCreateStep1(document.getElementById('create-step-body'));
  });
}

function validateStep1AndNext(){
  const d = state.createData;
  d.nguoiDeNghi = document.getElementById('f-nguoiDeNghi').value.trim();
  d.chuRungUyQuyen = document.getElementById('f-uyQuyen').value;
  const cccdSel = document.getElementById('f-cccd');
  if (cccdSel) d.cccdChuRung = cccdSel.value;
  if (!d.hoTenChuRung || !d.cccdChuRung || !d.nguoiDeNghi) {
    toast('Vui lòng chọn đủ Họ tên Chủ rừng, CCCD và nhập Người đề nghị.', 'warn');
    return;
  }
  goCreateStep(2);
}

  if (state.pcSearchResults === null) searchPhieuCan();
  else renderPcResultsTable();

}

/** Dữ liệu Số hợp đồng + Người nhận tiền đã được tải sẵn 1 lần duy nhất
 * (getChuRungContext) ngay khi chọn CCCD ở Bước 1 - ở đây CHỈ RENDER lại
 * từ state, không gọi server nữa (trừ trường hợp thiếu dữ liệu do vào
 * thẳng Bước 2 mà chưa qua Bước 1, ví dụ refresh trang giữa chừng). */
function renderSoHDOptions(){
  const d = state.createData;
  const sel = document.getElementById('f-soHD');
  if (!sel) return;
  if (d.prefetchedForCccd !== d.cccdChuRung) { fetchChuRungContextFallback(); return; }
  const list = d.soHopDongOptions;
  sel.innerHTML = (list.length?'<option value="">-- Chọn hợp đồng --</option>':'<option value="">Không có hợp đồng nào</option>') +
    list.map(h => `<option value="${esc(h.soHD)}" ${h.soHD===d.soHopDong?'selected':''}>${esc(h.soHD)} (ký ${esc(h.ngayKy)})</option>`).join('');
  sel.addEventListener('change', onSoHDChange);
  if (d.soHopDong) renderHopDongSummary();
}

function renderNguoiNhanOptions(){
  const d = state.createData;
  const sel = document.getElementById('f-nguoiNhan');
  if (!sel) return;
  if (d.prefetchedForCccd !== d.cccdChuRung) return; // fetchChuRungContextFallback() ở renderSoHDOptions() sẽ tự render lại cả 2
  const list = d.nguoiNhanOptions;
  sel.innerHTML = (list.length?'<option value="">-- Chọn người nhận --</option>':'<option value="">Không có dữ liệu Số TK (HD_STK)</option>') +
    list.map(n => `<option value="${esc(n)}" ${n===d.nguoiNhanTien?'selected':''}>${esc(n)}</option>`).join('');
  sel.addEventListener('change', onNguoiNhanChange);
  if (d.nguoiNhanTien) loadStkOptions();
}

/** Chỉ dùng khi vào thẳng Bước 2 mà chưa từng prefetch (trường hợp hiếm,
 * ví dụ F5 giữa chừng) - tính lại từ cache trình duyệt (mục AG), không
 * gọi server. */
function fetchChuRungContextFallback(){
  const d = state.createData;
  ensureBulkRef().then(ref => {
    const nameStd = standardizeClient(d.hoTenChuRung), cc = d.cccdChuRung;
    const hdRows = (ref.hopDong || []).filter(h => standardizeClient(h.hoTen) === nameStd && h.cccd === cc);
    const seenHD = new Set(), soHopDongOptions = [];
    hdRows.forEach(h => {
      if (!h.soHD || seenHD.has(h.soHD)) return;
      seenHD.add(h.soHD);
      soHopDongOptions.push({ soHD: h.soHD, ngayKy: h.ngayKy, slDuKien: h.slDuKien });
    });
    const seenNguoi = new Set(), nguoiNhanOptions = [];
    (ref.taiKhoan || []).forEach(t => {
      if (standardizeClient(t.hoTen) !== nameStd || t.cccd !== cc) return;
      if (!t.nguoiUQ || seenNguoi.has(t.nguoiUQ)) return;
      seenNguoi.add(t.nguoiUQ); nguoiNhanOptions.push(t.nguoiUQ);
    });
    d.soHopDongOptions = soHopDongOptions;
    d.nguoiNhanOptions = nguoiNhanOptions;
    d.prefetchedForCccd = d.cccdChuRung;
    renderSoHDOptions();
    renderNguoiNhanOptions();
  });
}

function onSoHDChange(){
  const d = state.createData;
  const sel = document.getElementById('f-soHD');
  d.soHopDong = sel.value;
  const opt = d.soHopDongOptions.find(h => h.soHD === d.soHopDong);
  d.ngayKyHopDong = opt ? opt.ngayKy : '';
  renderHopDongSummary();
}

function renderHopDongSummary(){

  if (!d.soHopDong) { box.innerHTML = ''; return; }

  call('getHopDongSummary', [d.soHopDong, d.soTKNhanTien || ''], null).then(s => {
    if (!box) return;
    if (!s) { box.innerHTML = ''; return; }
    // Lưu lại để dùng ở Bước 3 (Xác nhận & Lưu) - mục "Số lần chuyển
    // khoản thành công vào tài khoản".
    d.soLanChoTKDangDeNghi = s.soLanChoTKDangDeNghi;
    const vuot = s.conLaiHayVuot < 0;
    box.innerHTML = `
      <div style="margin-top:12px; padding:14px; background:var(--paper-2); border-radius:8px">
        <div class="grid cols-4" style="gap:10px">
          <div><div class="muted" style="font-size:11px">Ngày ký</div><div style="font-weight:600">${esc(s.ngayKy)||'–'}</div></div>
          <div><div class="muted" style="font-size:11px">SL dự kiến</div><div style="font-weight:600">${fmtKl(s.slDuKien)} tấn</div></div>
          <div><div class="muted" style="font-size:11px">SL đã thực hiện</div><div style="font-weight:600">${fmtKl(s.slThucHien)} tấn</div></div>
          <div><div class="muted" style="font-size:11px">${vuot?'Đã vượt':'Còn lại'}</div><div style="font-weight:600; color:${vuot?'var(--danger)':'var(--moss)'}">${fmtKl(Math.abs(s.conLaiHayVuot))} tấn</div></div>
        </div>
        <div style="margin-top:10px; font-size:12.5px">Đã thanh toán <b>${s.soLanDaThanhToan}</b> lần${d.soTKNhanTien ? ` · Tài khoản đang đề nghị đã nhận <b>${s.soLanChoTKDangDeNghi}</b> lần trước đó` : ''}</div>
        ${s.danhSachLanThanhToan.length ? `<details style="margin-top:8px">
          <summary style="cursor:pointer;color:var(--moss);font-size:12.5px;font-weight:600">+ Xem chi tiết ${s.danhSachLanThanhToan.length} lần thanh toán của hợp đồng</summary>
          <table style="margin-top:8px"><thead><tr><th>Ngày</th><th>STK</th><th>Ngân hàng</th><th class="num">Số tiền</th></tr></thead><tbody>
            ${s.danhSachLanThanhToan.map(x=>`<tr><td>${esc(x.ngay)}</td><td class="mono">${esc(x.stk)}</td><td>${esc(x.nganHang)}</td><td class="num">${fmtMoney(x.soTien)}</td></tr>`).join('')}
          </tbody></table>
        </details>` : '<div class="muted" style="font-size:12px;margin-top:6px">Chưa có lần thanh toán chính thức nào cho hợp đồng này.</div>'}
      </div>`;
  });
}

/** MỚI (mục AA): nút "🔄 Tải & Tính Lại" ở Bước 2 - làm mới cache
 * Phiếu Cân/HD_NCC/HD_STK/Tiến Độ Hợp Đồng rồi tải lại đúng những gì
 * đang hiển thị ở bước này (danh sách hợp đồng/người nhận + tóm lược
 * hợp đồng đang chọn nếu có). */
function doRefreshCreateFlowData(){
  call('webRefreshCreateFlowData', [], 'Đang tải & tính lại dữ liệu...').then(res => {
    if (res && res.message) toast(res.message, res.success ? undefined : 'err');
    // MỚI (mục AG): xóa luôn cache trình duyệt để lấy đúng dữ liệu vừa làm mới.
    invalidateBulkRef();
    const d = state.createData;
    ensureBulkRef().then(() => {
      d.prefetchedForCccd = ''; // buộc tính lại
      fetchChuRungContextFallback(); // tự render lại cả 2 danh sách (Hợp đồng + Người nhận)
      if (d.soHopDong) renderHopDongSummary();
    });
  });
}

function searchPhieuCan(){
  const d = state.createData;
  const q = document.getElementById('pc-search').value.trim();
  state.pcSearchQuery = q;
  state.pcResultsPage = 1;
  // Khớp đúng logic backend: nhiều số cách nhau bằng dấu phẩy HOẶC dấu cách.
  const isMultiList = q.split(/[,\s]+/).map(s=>s.trim()).filter(Boolean).length > 1;
  call('getAvailablePhieuCanForChuRung', [d.hoTenChuRung, q], 'Đang tìm phiếu cân...').then(list => {
    state.pcSearchResults = list;
    // MỚI (mục X): nhập danh sách nhiều số phiếu cân (ngăn cách dấu
    // phẩy) -> tự động CHỌN LUÔN tất cả kết quả khớp, khỏi phải bấm "+
    // Chọn" từng dòng - đúng ý "chọn nhiều phiếu cân cho nhanh".
    if (isMultiList && list.length) {
      let added = 0;
      list.forEach(p => { if (!isChosen(p.soPhieuCan)) { state.createData.phieuCan.push(p); added++; } });
      if (added > 0) toast(`✅ Đã tự động chọn ${added} phiếu cân khớp danh sách.`);
      document.getElementById('pc-search').value = '';
      state.pcSearchQuery = '';
      state.pcSearchResults = null;
    }
    renderPcResultsTable();
    renderChosenPcDesc();
  });
}

function renderPcResultsTable(){
  const box = document.getElementById('pc-results');
  if (!box) return;
  const list = state.pcSearchResults;
  if (!list) { box.innerHTML = '<div class="card"><div class="empty"><div class="ic">⏳</div>Đang tải danh sách phiếu cân khả dụng...</div></div>'; return; }
  if (!list.length) { box.innerHTML = '<div class="empty" style="padding:20px"><div class="ic">🔎</div>Không tìm thấy phiếu cân khả dụng khớp với chủ rừng này. Gõ số phiếu cân cụ thể (cách nhau bởi dấu phẩy/dấu cách) để tìm cả phiếu của khách hàng khác.</div>'; return; }
  const totalPages = Math.max(1, Math.ceil(list.length / PC_PICKER_PAGE_SIZE));
  if (state.pcResultsPage > totalPages) state.pcResultsPage = totalPages;
  const pageList = pageSlice(list, state.pcResultsPage, PC_PICKER_PAGE_SIZE);
  box.innerHTML = `<table><thead><tr><th>Số phiếu cân</th><th>Ngày nhập</th><th>Khách hàng</th><th class="num">KL(kg)</th><th class="num">Đơn giá</th><th class="num">Thành tiền</th><th></th></tr></thead><tbody>
    ${pageList.map(p => `<tr${p.khopTen===false?' style="background:var(--timber-light)"':''}>
      <td class="mono">${esc(p.soPhieuCan)}</td><td>${esc(p.ngayNhap)}</td>
      <td>${esc(p.khachHang)}${p.khopTen===false?' <span class="badge pending dot" title="Khác tên Chủ rừng đang chọn">⚠️ khác tên</span>':''}</td>
      <td class="num">${fmtKl(p.klKg)}</td><td class="num">${fmtMoney(p.donGia)}</td><td class="num">${fmtMoney(p.thanhTien)}</td>
      <td><button class="btn sm ${isChosen(p.soPhieuCan)?'ghost':'primary'}" onclick='addChosenPC(${JSON.stringify(p)})' ${isChosen(p.soPhieuCan)?'disabled':''}>${isChosen(p.soPhieuCan)?'Đã chọn':'+ Chọn'}</button></td>
    </tr>`).join('')}
  </tbody></table>
  ${renderPager(list.length, state.pcResultsPage, 'goPcResultsPage', PC_PICKER_PAGE_SIZE)}`;
}
function goPcResultsPage(p){ state.pcResultsPage = p; renderPcResultsTable(); }

function isChosen(soP){ return state.createData.phieuCan.some(p=>p.soPhieuCan===soP); }
function addChosenPC(p){
  if (isChosen(p.soPhieuCan)) return;
  state.createData.phieuCan.push(p);
  renderPcResultsTable();
  renderChosenPcDesc();
}
function removeChosenPCbyIndex(soP){
  state.createData.phieuCan = state.createData.phieuCan.filter(p=>p.soPhieuCan!==soP);
  renderPcResultsTable();
  renderChosenPcDesc();
}

/** Diễn giải "Số phiếu cân - KL - Đơn giá" nối bằng dấu phẩy, hiển thị
 * ngay dưới ô Số phiếu cân, đúng yêu cầu #5. */
function renderChosenPcDesc(){
  const el = document.getElementById('pc-chosen-desc');
  if (!el) return;
  const list = state.createData.phieuCan;
  if (!list.length) { el.innerHTML = '<span class="muted">Chưa chọn phiếu cân nào.</span>'; return; }
  const parts = list.map(p => `${esc(p.soPhieuCan)} - ${fmtKl(p.klKg)}kg - ${fmtMoney(p.donGia)}đ`);
  const total = list.reduce((s,p)=>s+(Number(p.klKg)||0),0);
  const soKhac = list.filter(p => p.khopTen === false).length;
  el.innerHTML = `<b>Diễn giải:</b> ${parts.join(', ')}
    <div class="muted" style="margin-top:4px">Tổng KL: ${fmtKl(total)} kg · ${list.length} phiếu${soKhac?` · <span style="color:var(--timber)">⚠️ ${soKhac} phiếu khác tên Chủ rừng</span>`:''}</div>
    <div style="margin-top:6px">${list.map(p=>`<span class="chip"${p.khopTen===false?' style="background:var(--timber-light)"':''}>${esc(p.soPhieuCan)}${p.khopTen===false?' ⚠️':''} <button onclick="removeChosenPCbyIndex('${esc(p.soPhieuCan)}')">&times;</button></span>`).join('')}</div>`;
}

function onNguoiNhanChange(){
  const d = state.createData;
  d.nguoiNhanTien = document.getElementById('f-nguoiNhan').value;
  d.soTKNhanTien = ''; d.nganHang = ''; d.stkOptions = [];
  loadStkOptions();
}

/** MỚI (mục AG): Số tài khoản tính CỤC BỘ từ cache trình duyệt, không
 * gọi server. */
function loadStkOptions(){
  const d = state.createData;
  const sel = document.getElementById('f-stk');
  if (sel) { sel.disabled = true; sel.innerHTML = '<option value="">Đang tải...</option>'; }
  ensureBulkRef().then(ref => {
    const nameStd = standardizeClient(d.hoTenChuRung), cc = d.cccdChuRung, nguoi = d.nguoiNhanTien;
    const seen = new Set(), list = [];
    (ref.taiKhoan || []).forEach(t => {
      if (standardizeClient(t.hoTen) !== nameStd || t.cccd !== cc) return;
      if (nguoi && t.nguoiUQ !== nguoi) return;
      if (!t.stk) return;
      const key = t.stk + '|' + t.nganHang;
      if (seen.has(key)) return;
      seen.add(key);
      list.push({ stk: t.stk, nganHang: t.nganHang, soHD: t.soHD });
    });
    d.stkOptions = list;
    if (!sel) return;
    sel.disabled = list.length === 0;
    sel.innerHTML = (list.length?'<option value="">-- Chọn số tài khoản --</option>':'<option value="">Không có STK phù hợp</option>') +
      list.map(s => `<option value="${esc(s.stk)}|${esc(s.nganHang)}" ${(s.stk===d.soTKNhanTien && s.nganHang===d.nganHang)?'selected':''}>${esc(s.stk)} · ${esc(s.nganHang)}</option>`).join('');
    sel.addEventListener('change', onStkChange);
  });
}

function onStkChange(){
  const d = state.createData;
  const val = document.getElementById('f-stk').value;
  if (!val) { d.soTKNhanTien=''; d.nganHang=''; return; }
  const parts = val.split('|');
  d.soTKNhanTien = parts[0]; d.nganHang = parts[1] || '';
  if (d.soHopDong) renderHopDongSummary();
}

function validateStep2AndNext(){
  const d = state.createData;
  d.ngayDeNghi = document.getElementById('f-ngayDeNghi').value;
  if (!d.soHopDong) { toast('Vui lòng chọn Số hợp đồng.', 'warn'); return; }
  if (!d.ngayDeNghi) { toast('Vui lòng nhập Ngày đề nghị.', 'warn'); return; }
  if (!d.phieuCan.length) { toast('Vui lòng chọn ít nhất 1 Số phiếu cân.', 'warn'); return; }
  if (!d.nguoiNhanTien) { toast('Vui lòng chọn Người nhận tiền.', 'warn'); return; }
  if (!d.soTKNhanTien) { toast('Vui lòng chọn Số tài khoản.', 'warn'); return; }
  goCreateStep(3);
}

/** MỚI (mục AF): cảnh báo nếu có phiếu cân với tên Khách hàng KHÁC Chủ
 * rừng đang chọn (không chặn, chỉ hỏi xác nhận trước khi lưu). */
function submitCreate(){
  const d = state.createData;
  const genericNames = new Set(['KH','KL','KHACHLE']);
  const nameStd = standardizeClient(d.hoTenChuRung);
  const mismatched = d.phieuCan.filter(p => {
    const khStd = standardizeClient(p.khachHang);
    return khStd && khStd !== nameStd && !genericNames.has(khStd);
  });
  if (mismatched.length > 0) {
    const danhSach = mismatched.map(p => `${p.soPhieuCan} (KH: ${p.khachHang})`).join(', ');
    const ok = confirm(`⚠️ Có ${mismatched.length} phiếu cân với tên Khách hàng KHÁC Chủ rừng "${d.hoTenChuRung}" đã chọn:\n${danhSach}\n\nBạn có chắc muốn tiếp tục lưu không?`);
    if (!ok) return;
  }
  doSubmitCreate();
}

function doSubmitCreate(){
  const d = state.createData;
  const payload = {
    hoTenChuRung: d.hoTenChuRung, cccdChuRung: d.cccdChuRung, nguoiDeNghi: d.nguoiDeNghi,
    chuRungUyQuyen: d.chuRungUyQuyen, nguoiNhanTien: d.nguoiNhanTien, soTKNhanTien: d.soTKNhanTien,
    nganHang: d.nganHang, soHopDong: d.soHopDong, ngayHopDong: d.ngayKyHopDong,
    ngayDeNghi: d.ngayDeNghi,
    danhSachPhieuCan: d.phieuCan.map(p=>p.soPhieuCan)
  };
  call('createNewPaymentRequest', [payload], 'Đang lưu...').then(res => {
    handleResult(res, () => {
      resetCreateData();
      state.draftView = 'list';
      refreshBadge();
      goTo('draft');
    });
  });
}

/* ============================================================
 * DANH SÁCH ĐNTT (gồm cả chức năng Tạo Mới - xem startCreateFlow())
 * ============================================================ */
function renderDraft(){
  if (!state.draftView) state.draftView = 'list';
  if (state.draftView === 'create') return renderCreate();

  document.getElementById('page-desc').textContent = PAGES.draft.desc;
  document.getElementById('topbar-actions').innerHTML = `
    <button class="btn" onclick="doLamMoiToanBo()">↻ Làm mới</button>
    <button class="btn accent" onclick="doTongHop112()">📤 Đề Nghị Thanh Toán (tính lại)</button>
    <button class="btn primary" onclick="startCreateFlow()">➕ Tạo Mới</button>`;
  if (!state.draftStatusFilter) state.draftStatusFilter = 'all';
  const c = document.getElementById('content');
  c.innerHTML = `
    <div class="subtabs">
      <div class="subtab" data-f="all">Tất cả</div>
      <div class="subtab" data-f="cho_tinh">1 · Chưa ĐNTT</div>
      <div class="subtab" data-f="cho_dntt">2 · Chờ ĐNTT</div>
      <div class="subtab" data-f="dang_dntt">3 · Đang ĐNTT (chờ duyệt)</div>
    </div>

function loadDraftList(){

/** MỚI (mục Y): nút "↻ Làm mới" giờ làm mới LUÔN cache Phiếu Cân chưa
 * TT + HD_NCC + HD_STK (mirror trong File Nháp) trước khi tải lại danh
 * sách - để bước chọn phiếu cân/hợp đồng ở "Tạo Mới" luôn nhanh & mới. */
function doLamMoiToanBo(){
  call('webRefreshPhieuCanCache', [], 'Đang làm mới dữ liệu (Phiếu Cân, Hợp Đồng)...').then(res => {
    if (res && res.message) toast(res.message);
    // MỚI (mục AG): xóa luôn cache trình duyệt (Danh sách Chủ rừng/Hợp
    // đồng) - lần sau vào "Tạo Mới" sẽ tự tải lại dữ liệu mới nhất.

  });
}

const DRAFT_STATUS_BADGE = {
  cho_tinh: '<span class="badge pending dot">Chưa ĐNTT</span>',
  cho_dntt: '<span class="badge wait dot">Chờ ĐNTT</span>',
  dang_dntt: '<span class="badge ready dot">Đang ĐNTT</span>'
};

function renderDraftTable(){
  document.querySelectorAll('#content > .subtabs .subtab').forEach(el => {
    el.classList.toggle('active', el.dataset.f === state.draftStatusFilter);
  });
  const wrap = document.getElementById('draft-table-wrap');
  const fullList = state.draftList;
  const list = fullList.filter(r => state.draftStatusFilter === 'all' || r.trangThaiKey === state.draftStatusFilter);
  if (!fullList.length) {
    wrap.innerHTML = `<div class="empty"><div class="ic">📭</div><h4>Chưa có ĐNTT nào đang chờ xử lý</h4>
      <p class="muted">Tạo đề nghị thanh toán mới để bắt đầu.</p>
      <button class="btn primary" onclick="startCreateFlow()">➕ Tạo Đề Nghị Thanh Toán</button></div>`;
    document.getElementById('draft-actionbar').classList.add('hidden');
    return;
  }
  if (!list.length) {
    wrap.innerHTML = `<div class="empty"><div class="ic">📭</div>Không có hồ sơ nào ở trạng thái này.</div>`;
    document.getElementById('draft-actionbar').classList.add('hidden');
    return;
  }
  wrap.innerHTML = `<table><thead><tr>
      <th><input type="checkbox" id="chk-all" onchange="toggleAll(this)"></th>
      <th>Chủ rừng</th><th>Người nhận</th><th>Ngân hàng / STK</th><th>Số HĐ</th>
      <th class="num">Số phiếu</th><th class="num">KL (kg)</th><th class="num">Số tiền</th><th>Trạng thái</th><th></th>
    </tr></thead><tbody>
    ${list.map(r => `<tr>
      <td><input type="checkbox" class="chk-row" data-id="${esc(r.idKey)}" ${r.sanSangChot?'':'disabled title="Chưa tính Đề Nghị Thanh Toán"'} onchange="toggleRow('${esc(r.idKey)}', this.checked)"></td>
      <td>${esc(r.chuRung)}</td>
      <td>${esc(r.nguoiNhan)}</td>
      <td>${esc(r.nganHang)}<br><span class="muted mono" style="font-size:11.5px">${esc(r.stk)}</span></td>
      <td class="mono">${esc(r.soHD)}</td>
      <td class="num">${r.soLuongPhieu}</td>
      <td class="num">${fmtKl(r.klTongKg)}</td>
      <td class="num">${r.sanSangChot ? fmtMoney(r.soTien) : '–'}</td>
      <td>${DRAFT_STATUS_BADGE[r.trangThaiKey] || esc(r.trangThaiLabel)}</td>
      <td style="white-space:nowrap">${draftRowActionsHtml(r)}</td>
    </tr>`).join('')}
    </tbody></table>`;
  updateDraftActionbar();
}

/** MỚI (mục W): Sửa/Xóa CHỈ cho phép ở trạng thái "Chờ ĐNTT". Hồ sơ
 * "Chưa ĐNTT" chỉ Xem. Hồ sơ "Đang ĐNTT" chỉ Xem + "Về Chờ ĐNTT" (để mở
 * khóa Sửa/Xóa nếu cần). */
function draftRowActionsHtml(r){
  const xem = `<button class="btn sm ghost" onclick="viewDraftDetail('${esc(r.idKey)}')">Xem</button>`;
  if (r.trangThaiKey === 'cho_dntt') {
    return `${xem}
      <button class="btn sm ghost" onclick="editDraftRecord('${esc(r.idKey)}')">Sửa</button>
      <button class="btn sm danger" onclick="confirmDeleteDraft('${esc(r.idKey)}')">Xóa</button>`;
  }
  if (r.trangThaiKey === 'dang_dntt') {
    return `${xem}
      <button class="btn sm ghost" onclick="doHuyXacNhan('${esc(r.idKey)}')">↩️ Về Chờ ĐNTT</button>`;
  }
  return xem; // cho_tinh (Chưa ĐNTT) - chỉ Xem
}

function doHuyXacNhan(idKey){
  if (!confirm(`Chuyển hồ sơ "${idKey}" về trạng thái "Chờ ĐNTT" để có thể Sửa/Xóa?`)) return;
  call('runHuyXacNhanDNTT', [idKey], 'Đang chuyển trạng thái...').then(res => handleResult(res, loadDraftList));
}

function toggleAll(cb){
  document.querySelectorAll('.chk-row:not(:disabled)').forEach(el => { el.checked = cb.checked; toggleRow(el.dataset.id, cb.checked); });
}
function toggleRow(id, checked){
  if (checked) state.draftSelected.add(id); else state.draftSelected.delete(id);
  updateDraftActionbar();
}
function updateDraftActionbar(){
  const bar = document.getElementById('draft-actionbar');
  const n = state.draftSelected.size;
  if (n > 0) {
    bar.classList.remove('hidden');
    const total = state.draftList.filter(r=>state.draftSelected.has(r.idKey)).reduce((s,r)=>s+r.soTien,0);
    document.getElementById('draft-selected-info').textContent = `Đã chọn ${n} hồ sơ · Tổng ${fmtMoney(total)} đ`;
    document.getElementById('draft-action-buttons').innerHTML = getDraftActionButtonsHtml();
  } else {
    bar.classList.add('hidden');
  }
}

/** Nút hành động thay đổi theo tab đang xem: "Chờ ĐNTT" chỉ có "Xác
 * Nhận"; "Đang ĐNTT" chỉ có "In Báo Cáo ĐNTT" + "Duyệt". Tab "Tất cả"
 * hiện đủ cả 3 (phòng khi chọn hồ sơ ở nhiều trạng thái khác nhau). */
/** SỬA LỖI: trước đây dựa theo TAB đang xem (state.draftStatusFilter) -
 * nên ở tab "Tất cả", chọn 1 dòng "Chờ ĐNTT" vẫn hiện nhầm nút "Duyệt"/
 * "In Báo Cáo ĐNTT" (chỉ dành cho "Đang ĐNTT"). Giờ dựa ĐÚNG theo trạng
 * thái THẬT của các dòng đang được chọn (state.draftSelected). */
function getDraftActionButtonsHtml(){
  const selectedRows = state.draftList.filter(r => state.draftSelected.has(r.idKey));
  const hasChoDntt = selectedRows.some(r => r.trangThaiKey === 'cho_dntt');
  const hasDangDntt = selectedRows.some(r => r.trangThaiKey === 'dang_dntt');

  if (hasChoDntt && !hasDangDntt) {
    return `<button class="btn primary" onclick="doXacNhanDNTT()">✅ Xác nhận đã chọn chuyển ĐNTT</button>`;
  }
  if (hasDangDntt && !hasChoDntt) {
    return `<button class="btn" onclick="doInBaoCaoDNTT()">🖨️ In Báo Cáo ĐNTT (đã chọn)</button>
      <button class="btn primary" onclick="openConfirmPaymentModal()">📨 Duyệt (Đóng Thanh Toán)</button>`;
  }
  if (!hasChoDntt && !hasDangDntt) return ''; // chỉ chọn "Chưa ĐNTT" - không có hành động nào khả dụng
  // Chọn LẪN cả "Chờ ĐNTT" và "Đang ĐNTT" cùng lúc (thường ở tab "Tất
  // cả") -> hiện đủ 3 nút, backend sẽ tự bỏ qua phần không đúng trạng
  // thái kèm cảnh báo rõ ràng (không làm sai dữ liệu).
  return `<button class="btn" onclick="doXacNhanDNTT()">✅ Xác nhận đã chọn chuyển ĐNTT</button>
    <button class="btn" onclick="doInBaoCaoDNTT()">🖨️ In Báo Cáo ĐNTT (đã chọn)</button>
    <button class="btn primary" onclick="openConfirmPaymentModal()">📨 Duyệt (Đóng Thanh Toán)</button>`;
}

/** Bước 2 → 3: "Xác Nhận" các hồ sơ đang "Chờ ĐNTT" (đã tính tiền)
 * chuyển sang "Đang ĐNTT" (sẵn sàng in Báo Cáo ĐNTT & chờ Duyệt). Hồ sơ
 * chưa tính tiền trong lựa chọn sẽ tự bị bỏ qua kèm cảnh báo. */
function doXacNhanDNTT(){
  const ids = Array.from(state.draftSelected);
  if (!ids.length) { toast('Vui lòng chọn ít nhất 1 hồ sơ.', 'warn'); return; }
  call('runXacNhanDNTT', [ids], 'Đang Xác Nhận...').then(res => {
    if (res && res.needConfirm) {
      if (confirm(res.message)) {
        call('runXacNhanDNTT', [ids, true], 'Đang Xác Nhận...').then(res2 => handleResult(res2, () => loadDraftList()));
      }
      return;
    }
    handleResult(res, () => loadDraftList());
  });
}

/** Bước 3: in "Báo Cáo ĐNTT" (mẫu excel) cho các hồ sơ đã "Đang ĐNTT". */
function doInBaoCaoDNTT(){
  const ids = Array.from(state.draftSelected);
  if (!ids.length) { toast('Vui lòng chọn ít nhất 1 hồ sơ.', 'warn'); return; }
  call('exportBaoCaoDNTTFromDraft', [ids], 'Đang xuất Báo Cáo ĐNTT...').then(res => {
    if (res && res.success) {
      toast(res.message || '✅ Đã xuất Báo Cáo ĐNTT.');
      openModal(`<div class="modal-head"><h3>In Báo Cáo ĐNTT thành công</h3><button class="x" onclick="closeModal()">&times;</button></div>
        <div class="modal-body"><p>Báo cáo ĐNTT (chưa chốt) đã được tạo trong Google Drive.</p>
        <a href="${res.url}" target="_blank"><button class="btn primary">Mở file Báo Cáo ĐNTT</button></a></div>
        <div class="modal-foot"><button class="btn ghost" onclick="closeModal()">Đóng</button></div>`);
    } else {
      toast('❌ ' + (res && res.message || 'Xuất Báo Cáo ĐNTT thất bại.'), 'err');
    }
  });
}

function doTongHop112(){
  call('webRunCreate112', [], 'Đang tính Đề Nghị Thanh Toán...').then(res => {
    handleResult(res, () => loadDraftList());

}

function removePhieuCan(idCT, idKey){

}

function confirmDeleteDraft(idKey){
  if (!confirm('Xóa TOÀN BỘ hồ sơ "'+idKey+'" khỏi File Nháp?\nCác số phiếu cân liên quan sẽ được giải phóng ngay.')) return;

function openConfirmPaymentModal(){
  const ids = Array.from(state.draftSelected);
  if (!ids.length) return;
  const today = new Date();
  const dd = String(today.getDate()).padStart(2,'0'), mm = String(today.getMonth()+1).padStart(2,'0'), yyyy = today.getFullYear();
  openModal(`
    <div class="modal-head"><h3>Đóng Thanh Toán (${ids.length} hồ sơ)</h3><button class="x" onclick="closeModal()">&times;</button></div>
    <div class="modal-body">
      <p style="font-size:13px">Dữ liệu sẽ được ghi vào sheet chính thức, khóa Phiếu Cân vĩnh viễn, và xóa khỏi File Nháp.</p>
      <div class="field"><label>Ngày thanh toán (dd/mm/yyyy)</label><input type="text" id="pay-date" value="${dd}/${mm}/${yyyy}"></div>
    </div>
    <div class="modal-foot"><button class="btn ghost" onclick="closeModal()">Hủy</button>
      <button class="btn accent" onclick="submitConfirmPayment()">✅ Xác nhận Đóng Thanh Toán</button></div>
  `);
}

function submitConfirmPayment(){
  const dateStr = document.getElementById('pay-date').value.trim();
  const ids = Array.from(state.draftSelected);
  call('webConfirmPayment', [ids, dateStr], 'Đang chốt thanh toán...').then(res => {
    closeModal();
    handleResult(res, () => loadDraftList());
  });
}

function loadReport(){
  clampDateRange('rp-from', 'rp-to');
  const f = document.getElementById('rp-from').value, t = document.getElementById('rp-to').value;
  state.reportPage = 1;
  state.reportFilters = { chuRung:'', nguoiNhan:'', soHD:'', soLan:'' };
  call('getReportList', [f, t], 'Đang tải báo cáo...').then(rows => {
    state.reportRows = rows;
    // Mặc định chọn TẤT CẢ khi vừa tải - người dùng có thể bỏ chọn bớt
    state.reportSelected = new Set(rows.map(r => r.idHeThong));
    renderReportFilterOptions();
    renderReportTable();
  });
}

/** Xây danh sách lựa chọn cho 4 bộ lọc từ dữ liệu vừa tải (mục #5). */
function renderReportFilterOptions(){
  const card = document.getElementById('report-filter-card');
  const rows = state.reportRows;
  if (!rows.length) { card.classList.add('hidden'); return; }
  card.classList.remove('hidden');
  const distinct = key => Array.from(new Set(rows.map(r => r[key]).filter(Boolean))).sort((a,b)=>String(a).localeCompare(String(b)));
  const build = (id, key, cur) => {
    const sel = document.getElementById(id);
    const vals = distinct(key);
    sel.innerHTML = '<option value="">-- Tất cả --</option>' + vals.map(v => `<option value="${esc(v)}" ${v===cur?'selected':''}>${esc(v)}</option>`).join('');
    sel.onchange = () => { state.reportFilters[key] = sel.value; state.reportPage = 1; renderReportTable(); };
  };
  build('rp-f-churung', 'chuRung', state.reportFilters.chuRung);
  build('rp-f-nguoinhan', 'nguoiNhan', state.reportFilters.nguoiNhan);
  build('rp-f-sohd', 'soHD', state.reportFilters.soHD);
  build('rp-f-solan', 'soLan', state.reportFilters.soLan);
}

function getFilteredReportRows(){
  const f = state.reportFilters || {};
  return state.reportRows.filter(r =>
    (!f.chuRung || r.chuRung === f.chuRung) &&
    (!f.nguoiNhan || r.nguoiNhan === f.nguoiNhan) &&
    (!f.soHD || r.soHD === f.soHD) &&
    (!f.soLan || r.soLan === f.soLan)
  );
}

function renderReportTable(){
  const wrap = document.getElementById('report-wrap');
  const rows = getFilteredReportRows();
  if (!state.reportRows.length) {
    wrap.innerHTML = '<div class="empty"><div class="ic">📭</div>Không có hồ sơ nào đã chốt trong khoảng ngày này.</div>';
    document.getElementById('report-actionbar').classList.add('hidden');
    return;
  }
  if (!rows.length) {
    wrap.innerHTML = '<div class="empty"><div class="ic">🔍</div>Không có dòng nào khớp bộ lọc đang chọn.</div>';
    updateReportActionbar();
    return;
  }
  const totalPages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
  if (state.reportPage > totalPages) state.reportPage = totalPages;
  const pageRows = pageSlice(rows, state.reportPage);
  const total = rows.reduce((s,r)=>s+r.soTien,0);
  const allChecked = rows.every(r => state.reportSelected.has(r.idHeThong));
  wrap.innerHTML = `<table><thead><tr>
      <th><input type="checkbox" id="rp-chk-all" ${allChecked?'checked':''} onchange="toggleAllReport(this)"></th>
      <th>Ngày ĐN</th><th>Lần</th><th>Chủ rừng</th><th>Người nhận</th><th>Số HĐ</th><th>Ngân hàng / STK</th>
      <th class="num">KL (Tấn)</th><th class="num">Số tiền</th>
    </tr></thead><tbody>
    ${pageRows.map(r => `<tr>
      <td><input type="checkbox" class="rp-chk-row" data-id="${esc(r.idHeThong)}" ${state.reportSelected.has(r.idHeThong)?'checked':''} onchange="toggleReportRow('${esc(r.idHeThong)}', this.checked)"></td>
      <td>${esc(r.ngayDN)}</td><td>${esc(r.soLan)}</td><td>${esc(r.chuRung)}</td><td>${esc(r.nguoiNhan)}</td>
      <td class="mono">${esc(r.soHD)}</td>
      <td>${esc(r.nganHang)}<br><span class="muted mono" style="font-size:11.5px">${esc(r.stk)}</span></td>
      <td class="num">${fmtKl(r.klTan)}</td><td class="num">${fmtMoney(r.soTien)}</td>
    </tr>`).join('')}
    </tbody>
    <tfoot><tr style="font-weight:700"><td colspan="8" style="text-align:right;padding:10px">TỔNG CỘNG (${rows.length} dòng đang lọc)</td><td class="num" style="padding:10px">${fmtMoney(total)}</td></tr></tfoot>
    </table>
    ${renderPager(rows.length, state.reportPage, 'goReportPage')}`;
  updateReportActionbar();
}

function goReportPage(p){ state.reportPage = p; renderReportTable(); }

function toggleAllReport(cb){
  getFilteredReportRows().forEach(r => { if (cb.checked) state.reportSelected.add(r.idHeThong); else state.reportSelected.delete(r.idHeThong); });
  document.querySelectorAll('.rp-chk-row').forEach(el => el.checked = cb.checked);
  updateReportActionbar();
}
/** Nút "Chọn/Bỏ chọn tất cả" trên thanh hành động - áp cho các dòng
 * đang hiển thị theo bộ lọc hiện tại (không chỉ trang đang xem). */
function toggleAllReportBtn(){
  const rows = getFilteredReportRows();
  const allSelected = rows.length > 0 && rows.every(r => state.reportSelected.has(r.idHeThong));
  rows.forEach(r => { if (allSelected) state.reportSelected.delete(r.idHeThong); else state.reportSelected.add(r.idHeThong); });
  renderReportTable();
}
function toggleReportRow(id, checked){
  if (checked) state.reportSelected.add(id); else state.reportSelected.delete(id);
  const allChk = document.getElementById('rp-chk-all');
  if (allChk) allChk.checked = getFilteredReportRows().every(r => state.reportSelected.has(r.idHeThong));
  updateReportActionbar();
}
function updateReportActionbar(){
  const bar = document.getElementById('report-actionbar');
  const n = state.reportSelected.size;
  if (n > 0) {
    bar.classList.remove('hidden');
    const total = state.reportRows.filter(r => state.reportSelected.has(r.idHeThong)).reduce((s,r)=>s+r.soTien,0);
    document.getElementById('report-selected-info').textContent = `Đã chọn ${n}/${state.reportRows.length} dòng · Tổng ${fmtMoney(total)} đ`;
  } else {
    bar.classList.add('hidden');
  }
}

function exportReport(){
  const selectedRows = state.reportRows.filter(r => state.reportSelected.has(r.idHeThong));
  if (!selectedRows.length) { toast('Vui lòng chọn ít nhất 1 dòng để xuất báo cáo.', 'warn'); return; }
  const f = document.getElementById('rp-from').value, t = document.getElementById('rp-to').value;
  const dateRange = `${f} - ${t}`;
  call('webExportReport', [selectedRows, dateRange], 'Đang xuất báo cáo...').then(res => {
    if (res && res.success) {
      toast('✅ Đã xuất báo cáo thành công.');
      const nhBtn = res.updateNhUrl
        ? `<a href="${res.updateNhUrl}" target="_blank"><button class="btn" style="margin-top:8px">🏦 Mở File Import Ngân Hàng (Update_NganHang_DN, ${res.updateNhCount} dòng)</button></a>`
        : '';
      openModal(`<div class="modal-head"><h3>Xuất báo cáo thành công</h3><button class="x" onclick="closeModal()">&times;</button></div>
        <div class="modal-body"><p>Báo cáo (${selectedRows.length} dòng) đã được tạo trong Google Drive.</p>
        <a href="${res.url}" target="_blank"><button class="btn primary">Mở file báo cáo</button></a>
        ${nhBtn}
        ${res.updateNhUrl ? '<p class="muted" style="font-size:12px;margin-top:8px">Sheet "Update_NganHang_DN" đã được xóa và ghi lại toàn bộ dữ liệu import ngân hàng cho các dòng vừa xuất.</p>' : ''}
        </div>
        <div class="modal-foot"><button class="btn ghost" onclick="closeModal()">Đóng</button></div>`);
    } else {
      toast('❌ ' + (res && res.message || 'Xuất báo cáo thất bại.'), 'err');
    }
  });
}

/* ============================================================
 * BÁO CÁO CÔNG NỢ (4 tab con)
 * ============================================================ */
function renderDebt(){
  document.getElementById('topbar-actions').innerHTML = '';
  if (!state.debtTab) state.debtTab = 'customer';
  // MỚI (mục AB): dùng ngày theo giờ GMT+7 (khớp với backend) để mặc
  // định "3 tháng gần nhất" TRÙNG với snapshot Công Nợ đã tính sẵn lúc
  // 7:30/13:00 - nếu lệch múi giờ, sẽ luôn tính trực tiếp (chậm hơn) dù
  // không cần thiết.
  if (!state.debtFrom) state.debtFrom = isoDaysAgoVN(90);
  if (!state.debtTo) state.debtTo = todayISOVN();
  if (!state.ctcnNgay) state.ctcnNgay = isoDaysAgoVN(1); // mục 11: mặc định "hôm qua" (khớp snapshot 15h)
  // SỬA (theo yêu cầu): Phân Tích NG-ĐL có bộ lọc RIÊNG - mặc định ĐẦU
  // THÁNG hiện tại -> HÔM NAY, khác với các tab khác (3 tháng gần nhất).
  if (!state.phanTichTo) state.phanTichTo = todayISOVN();
  if (!state.phanTichFrom) state.phanTichFrom = firstDayOfMonthStr(state.phanTichTo);

  const showRangeFilter = ['customer','contract','analysis'].includes(state.debtTab);
  const c = document.getElementById('content');
  c.innerHTML = `
    <div class="subtabs">
      <div class="subtab" data-t="customer">1 · Công nợ theo Khách hàng</div>
      <div class="subtab" data-t="contract">2 · Công nợ theo Hợp đồng</div>
      <div class="subtab" data-t="ledger">4 · Sổ chi tiết công nợ</div>
      <div class="subtab" data-t="analysis">5 · Phân tích thanh toán</div>
      <div class="subtab" data-t="phantich">6 · Phân tích Nhập/TT theo NG-ĐL</div>
      <div class="subtab" data-t="ctcn">7 · Chi tiết Công Nợ theo Phiếu Cân</div>
    </div>
    ${showRangeFilter ? `
    <div class="card">
      <div class="grid cols-3">
        <div class="field"><label>Từ ngày</label><input type="date" id="debt-from" value="${esc(state.debtFrom)}"></div>
        <div class="field"><label>Đến ngày (cũng là mốc tính công nợ lũy kế)</label><input type="date" id="debt-to" value="${esc(state.debtTo)}"></div>
        <div class="field" style="display:flex; align-items:flex-end"><button class="btn primary" onclick="loadDebtTab()">🔍 Xem</button></div>
      </div>
      <div class="hint-text" style="margin-top:6px">"Trong kỳ" giới hạn tối đa ~3 tháng để tải nhanh hơn; số dư/lũy kế vẫn tính đủ đến "Đến ngày" như bình thường.</div>
    </div>` : ''}
    ${state.debtTab === 'phantich' ? `
    <div class="card">
      <div class="grid cols-3">
        <div class="field"><label>Đến ngày</label><input type="date" id="pt-to" value="${esc(state.phanTichTo)}"></div>
        <div class="field"><label>Từ ngày (khóa = đầu tháng của "Đến ngày")</label><input type="date" id="pt-from" value="${esc(state.phanTichFrom)}" disabled></div>
        <div class="field" style="display:flex; align-items:flex-end"><button class="btn primary" onclick="loadDebtTab()">🔍 Xem</button></div>
      </div>
      <div class="hint-text" style="margin-top:6px">"Từ ngày" bị khóa, luôn tự động = ngày 1 đầu tháng của "Đến ngày" - chỉ cần chọn "Đến ngày" là đủ.</div>
    </div>` : ''}
    <div id="debt-body"></div>`;

  document.querySelectorAll('.subtab').forEach(el => {
    el.classList.toggle('active', el.dataset.t === state.debtTab);
    el.addEventListener('click', () => { state.debtTab = el.dataset.t; renderDebt(); });
  });

  if (state.debtTab === 'phantich') {
    const ptTo = document.getElementById('pt-to'), ptFrom = document.getElementById('pt-from');
    ptTo.addEventListener('change', () => {
      ptFrom.value = firstDayOfMonthStr(ptTo.value);
    });
  }

  loadDebtTab();
}

/** Ngày đầu tháng (dạng yyyy-MM-dd) của 1 ngày cho trước - dùng để tự
 * động khóa "Từ ngày" theo "Đến ngày" ở tab Phân Tích NG-ĐL. */
function firstDayOfMonthStr(dateStr){
  const d = new Date(dateStr + "T00:00:00");
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`;
}

function loadDebtTab(){
  const fromEl = document.getElementById('debt-from'), toEl = document.getElementById('debt-to');
  if (fromEl && toEl) {
    clampDateRange('debt-from', 'debt-to');
    state.debtFrom = fromEl.value;
    state.debtTo = toEl.value;
  }
  const ptFromEl = document.getElementById('pt-from'), ptToEl = document.getElementById('pt-to');
  if (ptFromEl && ptToEl) {
    state.phanTichFrom = ptFromEl.value;
    state.phanTichTo = ptToEl.value;
  }
  state.debtCustomerPage = 1; state.debtContractPage = 1;

  if (state.debtTab === 'customer') return loadDebtByCustomer();
  if (state.debtTab === 'contract') return loadDebtByContract();
  if (state.debtTab === 'ledger') return renderDebtLedgerTab();
  if (state.debtTab === 'analysis') return loadPaymentAnalysis();
  if (state.debtTab === 'phantich') return loadPhanTichNhapTT();
  if (state.debtTab === 'ctcn') return renderCtcnTab();
}

function loadLedgerDetail(){
  const type = document.getElementById('ledger-type').value;

function renderPhanTichPivotTable(title, pivot){
  if (!pivot.rows.length) {
    return `<div class="card"><h3>${esc(title)}</h3><div class="empty" style="padding:16px"><div class="ic">📭</div>Không có phát sinh trong khoảng ngày này.</div></div>`;
  }
  const grandTotals = pivot.tenList.map((_,i)=> pivot.rows.reduce((s,r)=>s+(r.values[i]||0),0));
  const grandKl = pivot.rows.reduce((s,r)=>s+r.tongKl,0);
  const grandGiaTri = pivot.rows.reduce((s,r)=>s+r.tongGiaTri,0);
  return `<div class="card">
    <h3>${esc(title)}</h3>
    <div style="overflow-x:auto">
    <table><thead><tr>
      <th>Ngày</th>${pivot.tenList.map(t=>`<th class="num">${esc(t)}</th>`).join('')}<th class="num">Tổng KL (kg)</th><th class="num">Tổng Giá Trị</th>
    </tr></thead><tbody>
      ${pivot.rows.map(r => `<tr><td>${esc(r.ngay)}</td>${r.values.map(v=>`<td class="num">${fmtKl(v)}</td>`).join('')}<td class="num">${fmtKl(r.tongKl)}</td><td class="num">${fmtMoney(r.tongGiaTri)}</td></tr>`).join('')}
    </tbody>
    <tfoot><tr style="font-weight:700"><td>TỔNG CỘNG</td>${grandTotals.map(v=>`<td class="num">${fmtKl(v)}</td>`).join('')}<td class="num">${fmtKl(grandKl)}</td><td class="num">${fmtMoney(grandGiaTri)}</td></tr></tfoot>
    </table>
    </div>
  </div>`;
}

function loadCtcnTab(){
  const ngayEl = document.getElementById('ctcn-ngay');
  const ngay = ngayEl ? ngayEl.value : state.ctcnNgay;
  state.ctcnNgay = ngay;
  state.ctcnPage = 1;
  const wrap = document.getElementById('ctcn-wrap');
  wrap.innerHTML = '<div class="card"><div class="empty"><div class="ic">⏳</div>Đang tải...</div></div>';
  call('getChiTietCongNoPhieuCanWeb', [ngay, {}], 'Đang tính công nợ theo phiếu cân...').then(rows => {
    state.ctcnAllRows = rows;
    state.ctcnFilters = { dl:'', ng:'', khachHang:'', ngayNhap:'' };
    renderCtcnFilterOptions();
    applyCtcnFiltersAndRender();
  });
}

function renderCtcnFilterOptions(){
  const rows = state.ctcnAllRows || [];
  const distinct = key => Array.from(new Set(rows.map(r=>r[key]).filter(Boolean))).sort((a,b)=>String(a).localeCompare(String(b)));
  const build = (id, key) => {
    const sel = document.getElementById(id);
    if (!sel) return;
    const cur = state.ctcnFilters[key];
    sel.innerHTML = '<option value="">-- Tất cả --</option>' + distinct(key).map(v=>`<option value="${esc(v)}" ${v===cur?'selected':''}>${esc(v)}</option>`).join('');
    sel.onchange = () => { state.ctcnFilters[key] = sel.value; state.ctcnPage = 1; applyCtcnFiltersAndRender(); };
  };
  build('ctcn-f-dl', 'dl');
  build('ctcn-f-ng', 'ng');
  build('ctcn-f-kh', 'khachHang');
  build('ctcn-f-ngaynhap', 'ngayNhap1');
}

function applyCtcnFiltersAndRender(){
  const f = state.ctcnFilters || {};
  state.ctcnFilteredRows = (state.ctcnAllRows || []).filter(r =>
    (!f.dl || r.dl === f.dl) &&
    (!f.ng || r.ng === f.ng) &&
    (!f.khachHang || r.khachHang === f.khachHang) &&
    (!f.ngayNhap || r.ngayNhap1 === f.ngayNhap)
  );
  renderCtcnTable();
}

function renderCtcnTable(){
  const wrap = document.getElementById('ctcn-wrap');
  const rows = state.ctcnFilteredRows || [];
  if (!rows.length) {
    wrap.innerHTML = '<div class="card"><div class="empty"><div class="ic">📭</div>Không có phiếu cân nào chưa thanh toán khớp bộ lọc.</div></div>';
    return;
  }
  const totalPages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
  if (state.ctcnPage > totalPages) state.ctcnPage = totalPages;
  const pageRows = pageSlice(rows, state.ctcnPage);
  const tongKl = rows.reduce((s,r)=>s+r.klKg,0);
  const tongTien = rows.reduce((s,r)=>s+r.thanhTien,0);
  wrap.innerHTML = `
    <div class="grid cols-3">
      <div class="stat"><div class="label">Số phiếu chưa TT</div><div class="value">${rows.length}</div></div>
      <div class="stat"><div class="label">Tổng KL (kg)</div><div class="value">${fmtKl(tongKl)}</div></div>
      <div class="stat"><div class="label">Tổng Thành tiền</div><div class="value">${fmtMoney(tongTien)}</div></div>
    </div>
    <div class="card" style="margin-top:16px">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
        <h3 style="margin:0">Chi tiết công nợ theo phiếu cân (đến ${esc(state.ctcnNgay)})</h3>
        <button class="btn accent" onclick="doExportCtcn()">📥 Xuất Excel</button>
      </div>
      <div style="overflow-x:auto">
      <table><thead><tr>
        <th>Số phiếu cân</th><th>Ngày nhập</th><th>Giờ cân 1</th><th>Giờ cân 2</th>
        <th class="num">Cân lần 1</th><th class="num">Cân lần 2</th><th>Mặt hàng</th><th>Khách hàng</th>
        <th class="num">KL (kg)</th><th class="num">KL (tấn)</th><th class="num">Đơn giá</th><th class="num">Thành tiền</th>
        <th>ĐL</th><th>NG</th><th class="num">Chênh lệch ngày</th>
      </tr></thead><tbody>
        ${pageRows.map(r => `<tr>
          <td class="mono">${esc(r.soPhieuCan)}</td><td>${esc(r.ngayNhap1)}</td><td>${esc(r.gioCan1)}</td><td>${esc(r.gioCan2)}</td>
          <td class="num">${fmtKl(r.canLan1)}</td><td class="num">${fmtKl(r.canLan2)}</td><td>${esc(r.matHang)}</td><td>${esc(r.khachHang)}</td>
          <td class="num">${fmtKl(r.klKg)}</td><td class="num">${fmtKl(r.klTan)}</td><td class="num">${fmtMoney(r.donGia)}</td><td class="num">${fmtMoney(r.thanhTien)}</td>
          <td>${esc(r.dl)}</td><td>${esc(r.ng)}</td><td class="num ${r.chenhLechNgay>30?'debt-neg':''}">${r.chenhLechNgay}</td>
        </tr>`).join('')}
      </tbody></table>
      </div>
      ${renderPager(rows.length, state.ctcnPage, 'goCtcnPage')}
    </div>`;
}
function goCtcnPage(p){ state.ctcnPage = p; renderCtcnTable(); }

function doExportCtcn(){
